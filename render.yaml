# Garuda real-observation relay (no public packet/model inference).
# Uses the separate existing krishna-live-telemetry PostgreSQL instance.
services:
  - type: web
    name: krishna-shadow-telemetry
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m pip install -r deployment/render/requirements.txt && python -m compileall -q deployment/render garuda_v3/live_feed.py
    startCommand: python -m deployment.render.live_relay
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GARUDA_LIVE_SENSOR_TOKEN
        generateValue: true
      - key: RENDER_VIEWER_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: krishna-live-telemetry
          property: connectionString
