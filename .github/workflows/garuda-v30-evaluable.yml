name: Garuda V30 Evaluable-Event Calibrated Development

on:
  pull_request:
    branches: [main]
    paths:
      - 'garuda_v3/experiments/v30/**'
      - '.github/workflows/garuda-v30-evaluable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v30-evaluable-calibrated:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V30 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' 'scikit-learn<1.7'
      - name: Verify V30 frozen protocol
        run: |
          python - <<'PY'
          import json
          p=json.load(open('garuda_v3/experiments/v30/V30_PROTOCOL_FREEZE.json'))
          assert p['frozen_before_v30_results'] is True
          assert p['feature_policy']['strict_network_only'] is True
          assert p['feature_policy']['raw_ip_identity_model_feature'] is False
          assert 'locked' in p['final_validation']
          assert p['model']['test_information_used'] is False
          assert p['model']['evaluation_never_selects_model_or_threshold'] is True
          assert 'evaluable clean-onset events only' in p['temporal_protocol']['event_denominator']
          print('V30 protocol freeze: PASS')
          PY
      - name: Run V30 evaluable-event scenario-calibrated forecast
        working-directory: garuda_v3/experiments/v30
        run: python v30_iot23_evaluable_calibrated.py
      - name: Upload V30 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garuda-v30-evaluable-calibrated-evidence
          path: garuda_v3/experiments/v30/artifacts/iot23_evaluable_calibrated/
          if-no-files-found: warn
