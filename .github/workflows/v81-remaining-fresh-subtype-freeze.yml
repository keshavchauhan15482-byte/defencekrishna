name: V81 remaining fresh subtype freeze

on:
  push:
    branches: [feat/v67-ps9plus-evidence]
    paths:
      - 'garuda_v3/v81_remaining_fresh_subtype_freeze.py'
      - '.github/workflows/v81-remaining-fresh-subtype-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
      - name: Compile V81
        run: python -m compileall -q garuda_v3/v81_remaining_fresh_subtype_freeze.py
      - name: Download X-IIoTID
        run: |
          mkdir -p datasets/v81
          python - <<'PY'
          import shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(f'Expected one X-IIoTID source, got {matches}')
          shutil.copyfile(matches[0],Path('datasets/v81/XIIoTID.csv'))
          PY
      - name: Audit remaining fresh reserve using support only
        run: |
          mkdir -p garuda_v3/artifacts/v81_remaining_fresh_subtype_freeze
          python -m garuda_v3.v81_remaining_fresh_subtype_freeze \
            --csv datasets/v81/XIIoTID.csv \
            --output garuda_v3/artifacts/v81_remaining_fresh_subtype_freeze/freeze.json
      - name: Verify no-model freshness contract
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('garuda_v3/artifacts/v81_remaining_fresh_subtype_freeze/freeze.json')
          d=json.loads(p.read_text())
          assert d['selection_used_model_metrics'] is False
          assert d['model_training_or_scoring_performed'] is False
          assert d['model_scored_reserve_before_freeze'] is False
          assert d['all_previously_scored_subtypes_excluded'] is True
          exposed={k:set(v) for k,v in d['previously_scored_subtypes_by_stage'].items()}
          for stage,sub in d['selected_reserve_subtype_by_stage'].items():
              assert sub not in exposed.get(stage,set()), (stage,sub)
          assert d['selected_stage_count']==len(d['selected_stages'])==len(d['selected_reserve_subtype_by_stage'])
          assert d['fresh_holdout_exhausted_under_declared_support_gates'] == (d['selected_stage_count']==0)
          print('V81_FREEZE_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          print(json.dumps({
            'fresh_holdout_exhausted':d['fresh_holdout_exhausted_under_declared_support_gates'],
            'selected':d['selected_reserve_subtype_by_stage'],
            'support':d['reserve_stage_support'],
            'eligible_remaining':d['eligible_remaining_candidate_subtypes_by_stage'],
            'supportability':d['individual_stage_supportability_after_all_exposed_exclusion']
          },indent=2))
          PY
      - name: Upload immutable V81 freshness audit
        uses: actions/upload-artifact@v4
        with:
          name: v81-remaining-fresh-subtype-freeze
          path: garuda_v3/artifacts/v81_remaining_fresh_subtype_freeze/freeze.json
          if-no-files-found: error
          retention-days: 30
