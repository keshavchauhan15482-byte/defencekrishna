name: V76f maximal supportable subtype freeze

on:
  push:
    branches: [feat/v67-ps9plus-evidence]
    paths:
      - 'garuda_v3/v76f_supported_stage_subtype_freeze.py'
      - '.github/workflows/v76f-supported-stage-subtype-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
      - name: Compile V76f
        run: python -m compileall -q garuda_v3/v76_stage_subtype_support_freeze.py garuda_v3/v76f_supported_stage_subtype_freeze.py
      - name: Download X-IIoTID
        run: |
          mkdir -p datasets/v76f
          python - <<'PY'
          import shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(f'Expected one X-IIoTID source, got {matches}')
          shutil.copyfile(matches[0],Path('datasets/v76f/XIIoTID.csv'))
          PY
      - name: Freeze maximal supportable stage subset using support only
        run: |
          mkdir -p garuda_v3/artifacts/v76f_supported_stage_subtype_freeze
          python -m garuda_v3.v76f_supported_stage_subtype_freeze \
            --csv datasets/v76f/XIIoTID.csv \
            --output garuda_v3/artifacts/v76f_supported_stage_subtype_freeze/support_freeze.json
      - name: Verify support-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v76f_supported_stage_subtype_freeze/support_freeze.json').read_text())
          assert d['selection_used_model_metrics'] is False
          assert d['model_scored_reserve_before_freeze'] is False
          assert d['fine_subtype_column'].lower()=='class1'
          assert d['lifecycle_family_column'].lower()=='class2'
          assert d['binary_label_column'].lower()=='class3'
          assert d['selected_stage_count'] == len(d['selected_stages']) == len(d['selected_reserve_subtype_by_stage'])
          assert d['selected_stage_count'] >= 1
          gate=d['support_gates']
          assert all(v>=gate['minimum_reserve_target_sequences_per_selected_stage'] for v in d['reserve_stage_support'].values())
          assert all(d['development_stage_support_after_all_reserves'][s]>=gate['minimum_remaining_development_sequences_per_selected_stage'] for s in d['selected_stages'])
          print(json.dumps({
            'selected_stage_count':d['selected_stage_count'],
            'selected_stages':d['selected_stages'],
            'selected':d['selected_reserve_subtype_by_stage'],
            'reserve_support':d['reserve_stage_support'],
            'clean_onset_diagnostic':d['clean_onset_support_diagnostic_only'],
            'development_support':d['development_stage_support_after_all_reserves'],
            'unsupported':d['unsupported_stage_audit'],
          },indent=2))
          PY
      - name: Upload V76f freeze
        uses: actions/upload-artifact@v4
        with:
          name: v76f-supported-stage-subtype-freeze
          path: garuda_v3/artifacts/v76f_supported_stage_subtype_freeze/support_freeze.json
          if-no-files-found: error
          retention-days: 30
