name: V91 RT-IoT2022 External One-Shot

on:
  workflow_dispatch:
  push:
    branches: [feat/v67-ps9plus-evidence]
    paths:
      - 'garuda_v3/v91_rtiot2022_external_freeze.json'
      - 'garuda_v3/v91_rtiot2022_external_one_shot.py'
      - '.github/workflows/v91-rtiot2022-external-one-shot.yml'

permissions:
  contents: read

jobs:
  v91:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
      - name: Compile V91
        run: python -m compileall -q garuda_v3/v91_rtiot2022_external_one_shot.py
      - name: Verify sealed second-source precommit
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('garuda_v3/v91_rtiot2022_external_freeze.json')
          d=json.loads(p.read_text())
          assert d['selection_uses_test_metrics'] is False
          assert d['fit_on_rtiot2022'] is False
          assert d['distribution']=='Kaggle mirror joebeachcapital/real-time-internet-of-things-rt-iot2022'
          print('freeze_sha256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Download UNSW development source
        run: |
          mkdir -p datasets/v91
          python - <<'PY'
          from pathlib import Path
          import kagglehub
          root=Path(kagglehub.dataset_download('mrwellsdavid/unsw-nb15'))
          Path('datasets/v91/unsw_root.txt').write_text(str(root))
          assert len(list(root.rglob('UNSW-NB15_[1-4].csv')))==4
          PY
      - name: Download exactly frozen RT-IoT2022 source
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('joebeachcapital/real-time-internet-of-things-rt-iot2022'))
          hits=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              if any('attack' in str(c).lower() and 'type' in str(c).lower() for c in cols): hits.append(p)
          if len(hits)!=1: raise RuntimeError(f'Expected exactly one RT-IoT2022 CSV, got {hits}')
          Path('datasets/v91/rtiot_path.txt').write_text(str(hits[0]))
          print('sealed_test_file',hits[0].name,hits[0].stat().st_size)
          PY
      - name: Run V91 one-shot second-source test
        run: |
          ROOT=$(cat datasets/v91/unsw_root.txt)
          TEST=$(cat datasets/v91/rtiot_path.txt)
          python -m garuda_v3.v91_rtiot2022_external_one_shot \
            --unsw-root "$ROOT" \
            --freeze garuda_v3/v91_rtiot2022_external_freeze.json \
            --rtiot "$TEST" \
            --output garuda_v3/artifacts/v91_rtiot2022_external
      - name: Verify evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v91_rtiot2022_external/summary.json').read_text())
          assert d['fit_on_rtiot2022'] is False
          assert d['selection_uses_rtiot2022_metrics'] is False
          assert all(d['no_test_tuning_contract'].values())
          print(json.dumps({
            'selected_model':d['selected_model'],
            'external_audit':d['external_audit'],
            'external_metrics':d['external_metrics'],
            'per_attack_type':d['per_attack_type'],
            'freeze_sha256':d['freeze_sha256'],
            'pretest_model_selection_sha256':d['pretest_model_selection_sha256'],
            'test_file_sha256':d['test_file_sha256']
          },indent=2))
          PY
      - name: Upload V91 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v91-rtiot2022-external-one-shot-evidence
          path: garuda_v3/artifacts/v91_rtiot2022_external/*.json
          retention-days: 30
          if-no-files-found: error
