name: V89 Controlled Progression Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v67-ps9plus-evidence
    paths:
      - 'garuda_v3/v89_controlled_progression_gate.py'
      - '.github/workflows/v89-controlled-progression-gate.yml'

permissions:
  contents: read

jobs:
  v89:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile V89
        run: |
          python -m compileall -q \
            garuda_v3/v81_remaining_fresh_subtype_freeze.py \
            garuda_v3/v86_multihorizon_progression.py \
            garuda_v3/v89_controlled_progression_gate.py
      - name: Download X-IIoTID
        run: |
          mkdir -p datasets/v89
          python - <<'PY'
          import shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(f'Expected one X-IIoTID source, got {matches}')
          shutil.copyfile(matches[0],Path('datasets/v89/XIIoTID.csv'))
          PY
      - name: Reproduce immutable V81 freeze
        run: |
          mkdir -p garuda_v3/artifacts/v89_controlled_progression
          python -m garuda_v3.v81_remaining_fresh_subtype_freeze \
            --csv datasets/v89/XIIoTID.csv \
            --output garuda_v3/artifacts/v89_controlled_progression/v81_freeze.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('garuda_v3/artifacts/v89_controlled_progression/v81_freeze.json')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest=='820aa7de8925d3d0812e1df3753c9f4a2c7da0f5d45efd3d16456b33e3e7d75f',digest
          PY
      - name: Run V89 controlled risk and progression benchmark
        run: |
          python -m garuda_v3.v89_controlled_progression_gate \
            --csv datasets/v89/XIIoTID.csv \
            --freeze garuda_v3/artifacts/v89_controlled_progression/v81_freeze.json \
            --output garuda_v3/artifacts/v89_controlled_progression/results \
            --epochs 18
      - name: Verify V89 control and leakage contract
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v89_controlled_progression/results/summary.json').read_text())
          c=d['leakage_contract']
          assert c['subtype_fold_head_fit_excludes_held_out_subtype'] is True
          assert c['subtype_fold_has_real_negative_controls'] is True
          assert c['calibration_threshold_and_eval_control_slices_disjoint'] is True
          assert c['thresholds_use_development_only'] is True
          assert c['reserve_metrics_used_for_world_selection'] is False
          assert c['reserve_metrics_used_for_garuda_alpha_selection'] is False
          assert c['attack_or_stage_labels_are_world_model_inputs'] is False
          assert c['future_observed_state_used_at_inference'] is False
          assert c['reused_exposed_reserve_labeled_fresh'] is False
          assert c['pre_compromise_claim'] is False
          assert d['controlled_subtype_cv']['selection_uses_exposed_reserve_metrics'] is False
          assert d['release_gate']['fresh_claim_allowed'] is False
          assert d['release_gate']['selected_garuda_alpha_positive'] is True
          selected=d['controlled_subtype_cv']['selected_garuda_variant']
          assert selected.startswith('garuda_future_alpha_') and not selected.endswith('0.00')
          complete=[r for r in d['controlled_subtype_cv']['all_variants'] if 'error' not in r]
          assert complete
          for row in complete:
              for fold in row['folds']:
                  assert fold['real_negative_control_rows'] >= 100, fold
                  assert fold['positives'] > 0 and fold['negatives'] > 0, fold
                  assert math.isfinite(float(fold['fpr']))
                  assert math.isfinite(float(fold['recall']))
          print(json.dumps({
              'selected_garuda_variant':selected,
              'controlled_subtype_cv':[r for r in complete if r['variant']==selected][0],
              'three_way_mean_supported_f1':d['three_way_development_ablation']['mean_supported_f1'],
              'three_way_mean_supported_recall':d['three_way_development_ablation']['mean_supported_recall'],
              'exposed_reserve_positive_diagnostic':d['exposed_reserve_positive_diagnostic'],
              'state_task':d['world_model']['state_task_exposed_diagnostic'],
              'release_gate':d['release_gate'],
          },indent=2))
          PY
      - name: Upload V89 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v89-controlled-progression-evidence
          path: garuda_v3/artifacts/v89_controlled_progression/**/*.json
          if-no-files-found: error
          retention-days: 30
