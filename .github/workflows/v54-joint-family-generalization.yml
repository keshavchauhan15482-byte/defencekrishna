name: V54 joint-family generalisation hardening

on:
  push:
    branches: [fix/joint-family-generalization-v54]
    paths:
      - 'garuda_v3/v54_joint_family_generalization.py'
      - 'garuda_v3/tests/test_v54_joint_family_generalization.py'
      - '.github/workflows/v54-joint-family-generalization.yml'
  pull_request:
    paths:
      - 'garuda_v3/v54_joint_family_generalization.py'
      - 'garuda_v3/tests/test_v54_joint_family_generalization.py'
      - '.github/workflows/v54-joint-family-generalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robust-joint-family:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile and run leakage/selection tests
        run: |
          python -m compileall -q garuda_v3/v54_joint_family_generalization.py
          python -m unittest garuda_v3.tests.test_v54_joint_family_generalization -v
      - name: Download public X-IIoTID source
        run: |
          mkdir -p datasets/v54
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          import pandas as pd
          import kagglehub
          root = Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches = []
          for p in root.rglob('*.csv'):
              try:
                  cols = pd.read_csv(p, nrows=0).columns
              except Exception:
                  continue
              normalized = {''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'} <= normalized:
                  matches.append(p)
          if len(matches) != 1:
              raise RuntimeError(f'Expected exactly one X-IIoTID CSV; found {matches}')
          dst = Path('datasets/v54/XIIoTID.csv')
          shutil.copyfile(matches[0], dst)
          print(json.dumps({'destination': str(dst), 'bytes': dst.stat().st_size}))
          PY
      - name: Select on pair-held-out development families then run joint regression
        run: |
          python -m garuda_v3.v54_joint_family_generalization \
            --csv datasets/v54/XIIoTID.csv \
            --output garuda_v3/artifacts/v54 \
            --seeds 42 43 44 \
            --epochs 12 \
            --reserve-families exploitation 'c&c'
      - name: Print frozen selection and joint-family result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('garuda_v3/artifacts/v54/summary.json').read_text())
          print(json.dumps({
            'frozen_config': d['frozen_config'],
            'joint_reserve_summary': {
              k: v['summary'] for k, v in d['joint_reserve_regression']['families'].items()
            },
            'support': d['joint_reserve_regression']['support'],
          }, indent=2))
          PY
      - name: Upload V54 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v54-joint-family-generalization-evidence
          if-no-files-found: error
          retention-days: 14
          path: garuda_v3/artifacts/v54/*.json
