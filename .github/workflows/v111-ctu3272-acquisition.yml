name: V111 CTU Botnet 327-2 acquisition freeze (sealed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sealed-acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable pre-decode acquisition evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('garuda_v3/artifacts/certification/v111/acquisition_manifest.json').read_text())
          assert a['schema_version']=='v111-acquisition.1'
          assert a['status']=='HASH_FROZEN_MODEL_NOT_RUN'
          assert a['bytes']==69890363
          assert a['sha256']=='ce9d45d2b5c0be8be56481cbd4d98a094a96e453328e9d88f88e882d94a79884'
          assert a['md5']=='8bf6f9ec33d1c521ee4129671d31ee61'
          assert a['packet_records_decoded'] is False
          assert a['graph_windows_constructed'] is False
          assert a['support_scoring_performed'] is False
          assert a['model_inference_performed'] is False
          assert a['external_labels_accessed'] is False
          print('V111 acquisition evidence remains sealed pre-decode/pre-inference')
          PY
