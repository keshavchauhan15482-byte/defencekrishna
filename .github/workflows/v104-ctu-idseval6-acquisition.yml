name: V104 CTU-IDSEVAL-6 acquisition freeze (sealed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sealed-acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify hash-frozen acquisition evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path, PurePosixPath
          p=json.loads(Path('garuda_v3/artifacts/certification/v104/preregistration.json').read_text())
          a=json.loads(Path('garuda_v3/artifacts/certification/v104/acquisition_manifest.json').read_text())
          assert p['schema_version']=='v104-prereg.3'
          assert p['status']=='HASH_FROZEN_ONE_SHOT_REGISTERED'
          assert p['evaluation_permitted'] is True
          assert a['schema_version']=='v104-acquisition.3'
          assert a['status']=='HASH_AND_ENTRY_METADATA_FROZEN_MODEL_NOT_RUN'
          assert a['archive_sha256']==p['external_holdout']['archive_sha256']
          assert a['archive_md5']==p['external_holdout']['official_archive_md5']
          assert a['pcap_entries']==p['external_holdout']['pcap_entries']
          assert len(a['pcap_entries'])==6
          assert a['packet_records_decoded'] is False
          assert a['model_inference_performed'] is False
          assert all('__MACOSX' not in PurePosixPath(x['filename']).parts for x in a['pcap_entries'])
          assert all(not PurePosixPath(x['filename']).name.startswith('._') for x in a['pcap_entries'])
          print('V104 acquisition is sealed; no further acquisition mutation is required')
          PY
