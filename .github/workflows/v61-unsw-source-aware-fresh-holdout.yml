name: V61 UNSW source-aware fresh-family holdout

on:
  push:
    branches: [fix/v57-metric-strengthening]
    paths:
      - 'garuda_v3/v61_unsw_source_aware_fresh_holdout.py'
      - 'garuda_v3/v60_residual_state_forecasting.py'
      - 'garuda_v3/v59_unsw_independent_replication.py'
      - '.github/workflows/v61-unsw-source-aware-fresh-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-unsw-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile V61
        run: |
          python -m compileall -q garuda_v3/v61_unsw_source_aware_fresh_holdout.py
      - name: Download UNSW-NB15
        run: |
          mkdir -p datasets/v61
          python - <<'PY'
          from pathlib import Path
          import kagglehub
          root=Path(kagglehub.dataset_download('mrwellsdavid/unsw-nb15'))
          Path('datasets/v61/root.txt').write_text(str(root))
          print(root)
          for p in sorted(root.rglob('UNSW-NB15_[1-4].csv')):
              print(p.name, p.stat().st_size)
          PY
      - name: Run source-aware fresh-family benchmark
        run: |
          ROOT=$(cat datasets/v61/root.txt)
          python -m garuda_v3.v61_unsw_source_aware_fresh_holdout \
            --dataset-root "$ROOT" \
            --output garuda_v3/artifacts/v61_unsw \
            --seeds 42 43 44 \
            --epochs 18
      - name: Verify leakage contract and print result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v61_unsw/summary.json').read_text())
          f=d['frozen_config']
          assert f['reserve_metrics_used_for_selection'] is False
          assert f['reserve_selected_by_support_only'] is True
          assert f['source_aware_embargo'] is True
          assert f['fresh_reserve_family'] not in f['development_families']
          assert f['fresh_reserve_family'] not in f['contaminated_excluded']
          print(json.dumps({
              'fresh_reserve_family': f['fresh_reserve_family'],
              'development_families': f['development_families'],
              'fusion': {k:f[k] for k in ('selection_candidate','weights','policy_budget','config_sha256')},
              'support': d['fresh_reserve']['support'],
              'summary': d['fresh_reserve']['summary'],
          }, indent=2))
          PY
      - name: Upload V61 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v61-unsw-source-aware-fresh-holdout-evidence
          retention-days: 14
          if-no-files-found: error
          path: garuda_v3/artifacts/v61_unsw/*.json
