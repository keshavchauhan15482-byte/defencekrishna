name: V93 Corrected Attack-Step Lead Time

on:
  workflow_dispatch:
  push:
    branches: [feat/v67-ps9plus-evidence]
    paths:
      - 'garuda_v3/v93_corrected_attack_step_leadtime.py'
      - 'garuda_v3/v92_corrected_attack_step_leadtime.py'
      - 'garuda_v3/tests/test_v92_corrected_leadtime.py'
      - '.github/workflows/v93-corrected-attack-step-leadtime.yml'
      - 'datasets/multisource/recovered/attack_info_axile.csv'
      - 'datasets/multisource/recovered/attack_info_axile_provenance.json'
      - 'datasets/multisource/catalogue.json'

permissions:
  contents: read

jobs:
  corrected-leadtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile V93 and corrected timing tests
        run: python -m compileall -q garuda_v3/v93_corrected_attack_step_leadtime.py garuda_v3/v92_corrected_attack_step_leadtime.py garuda_v3/tests/test_v92_corrected_leadtime.py
      - name: Test corrected timing contract
        run: python -m unittest garuda_v3.tests.test_v92_corrected_leadtime -v
      - name: Verify V93 namespace contract
        run: |
          python - <<'PY'
          import garuda_v3.v93_corrected_attack_step_leadtime as v93
          assert v93.PROTOCOL_VERSION == 'V93-history-end-attack-step-onset-v1'
          assert v93.prediction_issue_times([100]).tolist() == [110.0]
          grouped=v93.group_event_onsets([
              {'epoch':200,'tactic':'x','technique':'a'},
              {'epoch':200,'tactic':'y','technique':'b'},
          ])
          assert len(grouped)==1 and grouped[0]['raw_rows']==2
          rows,leads=v93.onset_audit(grouped,[190,200])
          assert rows[0]['warning_hit'] is True
          assert rows[0]['first_prediction_issue_epoch']==190.0
          assert leads==[10.0]
          print('V93 namespace and timing contract verified')
          PY
      - name: Fetch hash-verified CICAPT network captures
        run: |
          python -m garuda_v3.public_data_fetch \
            --catalogue datasets/multisource/catalogue.json \
            --root datasets/v93 \
            --ids cicapt_network \
            --extract
      - name: Run corrected attack-step onset audit
        run: |
          mkdir -p garuda_v3/artifacts/v93_corrected_attack_step_leadtime
          python -m garuda_v3.v93_corrected_attack_step_leadtime \
            --phase1 datasets/v93/1stPhase-timed-Merged.pcap \
            --phase2 datasets/v93/2ndPhase-timed-MergedV2.pcap \
            --timeline datasets/multisource/recovered/attack_info_axile.csv \
            --timeline-provenance datasets/multisource/recovered/attack_info_axile_provenance.json \
            --catalogue datasets/multisource/catalogue.json \
            --packet-limit 3000000 \
            --seeds 42 43 44 \
            --epochs 18 \
            --output garuda_v3/artifacts/v93_corrected_attack_step_leadtime/summary.json
      - name: Verify corrected timing, provenance, and claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v93_corrected_attack_step_leadtime/summary.json').read_text())
          c=d['leakage_contract']
          t=d['timing_contract']
          assert d['protocol_version']=='V93-history-end-attack-step-onset-v1'
          assert d['publisher_verified'] is False
          assert d['compromise_claim_allowed'] is False
          assert d['incident_level_claim_allowed'] is False
          assert t['prediction_issue_epoch']=='cutoff_bucket_start + window_seconds'
          assert t['legacy_timestamp_inflation_seconds']==10
          assert t['late_or_at_onset_alert_counts_as_early'] is False
          assert d['raw_timeline_rows_evaluated'] >= d['exact_timestamp_onset_groups_evaluated'] >= 5
          assert c['phase2_used_for_training'] is False
          assert c['phase2_used_for_normalization'] is False
          assert c['phase2_used_for_blend_selection'] is False
          assert c['phase2_used_for_threshold_selection'] is False
          assert c['timeline_events_used_for_threshold_selection'] is False
          assert c['alert_score_uses_observed_future_ground_truth'] is False
          assert len(d['seeds'])==3
          assert 'ATTACK-STEP ONSET' in d['claim_boundary']
          assert 'NOT verified successful-compromise lead time' in d['claim_boundary']
          members=d['capture_source_contract']['members']
          assert members['1stPhase-timed-Merged.pcap']['sha256']
          assert members['2ndPhase-timed-MergedV2.pcap']['sha256']
          print(json.dumps(d['summary'],indent=2))
          for seed,row in d['seeds'].items():
              print(seed,json.dumps({
                  'phase2_alert_rate':row['phase2_alert_rate'],
                  'onset_group_warning_recall':row['onset_group_warning_recall'],
                  'lead_seconds':row['lead_seconds'],
              },indent=2))
          PY
      - name: Upload V93 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v93-corrected-attack-step-leadtime-evidence
          path: garuda_v3/artifacts/v93_corrected_attack_step_leadtime/*.json
          if-no-files-found: error
          retention-days: 30
