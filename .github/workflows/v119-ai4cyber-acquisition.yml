name: V119 AI4CYBER acquisition freeze

on:
  push:
    branches: [feat/v119-ai4cyber-one-shot]
    paths:
      - '.github/workflows/v119-ai4cyber-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download and hash-freeze archive without packet decode
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request, zipfile
          from pathlib import Path

          root=Path('garuda_v3/artifacts/certification/v119')
          prereg_path=root/'preregistration.json'
          p=json.loads(prereg_path.read_text())
          assert p['status']=='SOURCE_SELECTED_HASH_PENDING'
          assert p['acquisition']['packet_decode_permitted'] is False
          assert p['acquisition']['model_inference_permitted'] is False
          e=p['external_holdout']
          archive=Path('/tmp/v119-ai4cyber.zip')
          req=urllib.request.Request(e['source_url'], headers={'User-Agent':'Mozilla/5.0 Garuda-V119/1.0'})
          with urllib.request.urlopen(req, timeout=120) as src, archive.open('wb') as dst:
              while True:
                  block=src.read(1024*1024)
                  if not block: break
                  dst.write(block)
          data=archive.read_bytes()
          archive_md5=hashlib.md5(data).hexdigest()
          if archive_md5 != e['archive_expected_md5']:
              raise SystemExit(f'Archive MD5 mismatch: {archive_md5}')
          archive_sha=hashlib.sha256(data).hexdigest()

          with zipfile.ZipFile(archive) as z:
              members=[i for i in z.infolist() if not i.is_dir()]
              pcaps=[i for i in members if i.filename.lower().endswith(('.pcap','.pcapng'))]
              if not pcaps:
                  raise SystemExit('No PCAP/PCAPNG members found')
              info=sorted(pcaps, key=lambda i: (-int(i.file_size), i.filename))[0]
              h=hashlib.sha256(); total=0
              with z.open(info) as src:
                  while True:
                      block=src.read(1024*1024)
                      if not block: break
                      h.update(block); total+=len(block)
              pcap_sha=h.hexdigest()
              listing=[{
                  'name':i.filename,
                  'uncompressed_bytes':int(i.file_size),
                  'compressed_bytes':int(i.compress_size),
                  'crc32':f'{i.CRC:08x}',
                  'is_pcap':i.filename.lower().endswith(('.pcap','.pcapng'))
              } for i in members]

          manifest={
              'schema_version':'v119-acquisition.1',
              'status':'HASH_FROZEN_NO_PACKET_DECODE',
              'source_url':e['source_url'],
              'archive_bytes':len(data),
              'archive_md5':archive_md5,
              'archive_sha256':archive_sha,
              'members':listing,
              'pcap_member_count':len(pcaps),
              'selection_rule':e['pcap_selection_rule'],
              'selected_pcap_member':info.filename,
              'selected_pcap_uncompressed_bytes':total,
              'selected_pcap_sha256':pcap_sha,
              'packet_records_decoded':False,
              'model_inference_performed':False,
              'labels_accessed':False
          }
          (root/'acquisition_manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          e['archive_bytes']=len(data)
          e['archive_md5']=archive_md5
          e['archive_sha256']=archive_sha
          e['pcap_member_count']=len(pcaps)
          e['pcap_member']=info.filename
          e['pcap_bytes']=total
          e['pcap_sha256']=pcap_sha
          p['status']='HASH_FROZEN_ONE_SHOT_ARMED'
          p['acquisition']['packet_decode_permitted']=True
          p['acquisition']['model_inference_permitted']=True
          p['evaluation_permitted']=True
          prereg_path.write_text(json.dumps(p,indent=2)+'\n')
          print(json.dumps({'archive_sha256':archive_sha,'pcap_count':len(pcaps),'pcap_member':info.filename,'pcap_sha256':pcap_sha,'pcap_bytes':total},indent=2))
          PY
      - name: Verify acquisition-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('garuda_v3/artifacts/certification/v119')
          p=json.loads((root/'preregistration.json').read_text())
          a=json.loads((root/'acquisition_manifest.json').read_text())
          assert p['status']=='HASH_FROZEN_ONE_SHOT_ARMED'
          assert p['evaluation_permitted'] is True
          assert p['external_holdout']['archive_sha256']==a['archive_sha256']
          assert p['external_holdout']['pcap_sha256']==a['selected_pcap_sha256']
          assert a['packet_records_decoded'] is False
          assert a['model_inference_performed'] is False
          assert a['labels_accessed'] is False
          print('V119 acquisition-only freeze: PASS')
          PY
      - name: Record immutable acquisition freeze
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garuda_v3/artifacts/certification/v119/preregistration.json garuda_v3/artifacts/certification/v119/acquisition_manifest.json
          git commit -m 'evidence(v119): freeze AI4CYBER archive and selected PCAP hashes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
