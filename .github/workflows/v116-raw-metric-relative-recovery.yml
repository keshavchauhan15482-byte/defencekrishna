name: V116 raw-metric relative PS-complete recovery

on:
  push:
    branches: [feat/v116-raw-metric-relative-recovery]
    paths:
      - 'garuda_v3/v116_raw_metric_relative_recovery.py'
      - '.github/workflows/v116-raw-metric-relative-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependency
        run: python -m pip install 'numpy<2.1'
      - name: Verify V116 objective contract
        run: |
          python -m compileall -q garuda_v3/v116_raw_metric_relative_recovery.py
          python - <<'PY'
          import numpy as np
          from garuda_v3.v116_raw_metric_relative_recovery import raw_metric_weights
          from garuda_v3.v115_relative_state_world_model import fit_transform
          rng=np.random.default_rng(116)
          x=rng.uniform(.1,2.0,size=(16,8,4,34)).astype(np.float32)
          m=np.ones((16,8,4),dtype=np.float32)
          for j in range(29,34): x[...,j]=1.0
          tr=fit_transform(x,m)
          w=raw_metric_weights(tr)
          assert w.shape==(34,) and np.isfinite(w).all() and (w>0).all()
          assert abs(float(w.mean())-1.0)<1e-5
          assert tr['future_information_used_for_transform'] is False
          print('V116 raw-metric objective contract: PASS')
          PY
      - name: Fetch hash-pinned CICAPT development captures
        run: |
          python -m garuda_v3.public_data_fetch \
            --catalogue datasets/multisource/catalogue.json \
            --root datasets/v116 \
            --ids cicapt_network \
            --extract
      - name: Train three-seed development candidate
        run: |
          rm -rf garuda_v3/artifacts/certification/v116
          python -m garuda_v3.v116_raw_metric_relative_recovery \
            --phase1 datasets/v116/1stPhase-timed-Merged.pcap \
            --phase2 datasets/v116/2ndPhase-timed-MergedV2.pcap \
            --output-dir garuda_v3/artifacts/certification/v116 \
            --packet-limit 2000000 \
            --seeds 42 43 44 \
            --epochs 8 \
            --batch-size 64
      - name: Verify fail-closed development evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('garuda_v3/artifacts/certification/v116/summary.json').read_text())
          assert r['schema_version']=='v116.1'
          assert r['status'] in {'DEV_RAW_METRIC_RELATIVE_PASS','DEV_RAW_METRIC_RELATIVE_FAIL'}
          assert r['selection']['phase2_used_for_selection'] is False
          assert r['selection']['external_used_for_selection'] is False
          assert r['objective_contract']['future_information_used'] is False
          assert r['objective_contract']['external_statistics_used'] is False
          assert r['support_gate']['fit_provenance']['all_consumed_external_holdouts_excluded_from_fit'] is True
          assert r['freeze']['new_external_holdout_selected'] is False
          if r['status']=='DEV_RAW_METRIC_RELATIVE_PASS':
              assert r['recovery_gate_passed'] is True
              assert r['freeze']['candidate_frozen_before_new_external_selection'] is True
              assert all(r['gates'].values())
          else:
              assert r['recovery_gate_passed'] is False
              assert r['freeze']['candidate_frozen_before_new_external_selection'] is False
          print(json.dumps({'status':r['status'],'selected':r['selected_candidate'],'support':r['support_gate'],'gates':r['gates'],'freeze':r['freeze']},indent=2))
          PY
      - name: Record immutable V116 development evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garuda_v3/artifacts/certification/v116
          git commit -m 'evidence(v116): record raw-metric relative development result'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v116-raw-metric-relative-evidence
          path: garuda_v3/artifacts/certification/v116/*
          if-no-files-found: error
          retention-days: 30
