name: V103 truncated-PCAP adapter recovery

on:
  push:
    branches: [feat/v103-truncated-pcap-recovery]
    paths:
      - 'garuda_v3/pcap_reader.py'
      - 'garuda_v3/v103_truncated_adapter_recovery.py'
      - 'garuda_v3/tests/test_v103_truncated_pcap.py'
      - 'garuda_v3/tests/test_v103_adapter_recovery.py'
      - '.github/workflows/v103-truncated-pcap-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adapter-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deterministic V103 runtime
        run: python -m pip install 'numpy<2.1' pytest

      - name: Verify strict-default, tolerant semantics, and quarantine
        run: |
          python -m compileall -q garuda_v3/pcap_reader.py garuda_v3/v103_truncated_adapter_recovery.py
          python -m pytest -q \
            garuda_v3/tests/test_v103_truncated_pcap.py \
            garuda_v3/tests/test_v103_adapter_recovery.py

      - name: Fetch hash-verified CICAPT development captures
        run: |
          python -m garuda_v3.public_data_fetch \
            --catalogue datasets/multisource/catalogue.json \
            --root datasets/v103 \
            --ids cicapt_network \
            --extract

      - name: Revalidate frozen V101 model with tolerant adapter
        run: |
          rm -rf garuda_v3/artifacts/certification/v103
          python -m garuda_v3.v103_truncated_adapter_recovery \
            --phase1 datasets/v103/1stPhase-timed-Merged.pcap \
            --phase2 datasets/v103/2ndPhase-timed-MergedV2.pcap \
            --model garuda_v3/artifacts/certification/v101/gnn_lstm_packet_candidate.npz \
            --support-gate garuda_v3/artifacts/certification/v101/support_gate.json \
            --v101-summary garuda_v3/artifacts/certification/v101/summary.json \
            --packet-limit 2000000 \
            --output garuda_v3/artifacts/certification/v103/summary.json

      - name: Verify evidence and quarantine boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('garuda_v3/artifacts/certification/v103/summary.json').read_text())
          assert r['schema_version']=='v103.1'
          assert r['status'] in {'DEV_ADAPTER_RECOVERY_PASS','DEV_ADAPTER_RECOVERY_FAIL'}
          assert r['frozen_runtime']['model_sha256']=='30694adf0819e6ffd79079512a348059195dcc651d7f0b4d5049e278b4d7cb79'
          assert r['frozen_runtime']['support_gate_sha256']=='2f281593f163ba3e4bbed592ea41eeaa1c8d5e3dfe49de933473b15fe6c17df3'
          assert r['frozen_runtime']['model_changed_from_v101'] is False
          assert r['frozen_runtime']['support_gate_changed_from_v101'] is False
          assert r['quarantine']['hikari_used'] is False
          assert r['quarantine']['mawi_used'] is False
          assert r['quarantine']['mawi_rerun_after_adapter_change_allowed'] is False
          assert r['development_sources']['development_reuse'] is True
          assert r['development_sources']['phase2']['used_for_selection'] is False
          assert r['freeze']['new_external_holdout_selected'] is False
          assert len(r['freeze']['adapter_contract_sha256'])==64
          assert len(r['freeze']['pcap_reader_sha256'])==64
          print(json.dumps({
            'status':r['status'],
            'state_forecasting':r['state_forecasting'],
            'runtime_support':r['runtime_support'],
            'parser_audit_phase1':r['development_sources']['phase1']['parser_audit'],
            'parser_audit_phase2':r['development_sources']['phase2']['parser_audit'],
            'adapter_contract_sha256':r['freeze']['adapter_contract_sha256'],
          }, indent=2))
          PY

      - name: Record immutable V103 development evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garuda_v3/artifacts/certification/v103/summary.json
          git commit -m "evidence(v103): record truncated-PCAP adapter recovery"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforce development recovery gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('garuda_v3/artifacts/certification/v103/summary.json').read_text())
          if not r['recovery_gate_passed']:
              raise SystemExit('V103 development adapter recovery gate did not pass')
          print('V103 DEV_ADAPTER_RECOVERY_PASS')
          PY

      - name: Upload V103 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v103-truncated-pcap-recovery-evidence
          path: garuda_v3/artifacts/certification/v103/summary.json
          if-no-files-found: error
          retention-days: 30
