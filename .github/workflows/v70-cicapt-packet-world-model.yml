name: V70 CICAPT packet+flow world-model benchmark

on:
  push:
    branches: [feat/v67-ps9plus-evidence]
    paths:
      - 'garuda_v3/v70_cicapt_packet_world_model.py'
      - '.github/workflows/v70-cicapt-packet-world-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packet-world-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile V70
        run: python -m compileall -q garuda_v3/v70_cicapt_packet_world_model.py
      - name: Fetch hash-verified CICAPT captures
        run: |
          python -m garuda_v3.public_data_fetch \
            --catalogue datasets/multisource/catalogue.json \
            --root datasets/v70 \
            --ids cicapt_network \
            --extract
      - name: Run 3-seed combined packet-flow forecasting benchmark
        run: |
          mkdir -p garuda_v3/artifacts/v70_cicapt_packet_world_model
          python -m garuda_v3.v70_cicapt_packet_world_model \
            --phase1 datasets/v70/1stPhase-timed-Merged.pcap \
            --phase2 datasets/v70/2ndPhase-timed-MergedV2.pcap \
            --packet-limit 2000000 \
            --seeds 42 43 44 \
            --epochs 18 \
            --output garuda_v3/artifacts/v70_cicapt_packet_world_model/summary.json
      - name: Verify cross-phase no-leakage contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v70_cicapt_packet_world_model/summary.json').read_text())
          c=d['leakage_contract']
          assert c['phase2_used_for_training'] is False
          assert c['phase2_used_for_normalization'] is False
          assert c['phase2_used_for_blend_selection'] is False
          assert c['phase2_used_for_early_stopping'] is False
          assert d['feature_count'] >= 30
          assert len(d['seeds']) == 3
          print(json.dumps(d['summary'], indent=2))
          print(json.dumps(d['seeds'], indent=2))
          PY
      - name: Upload V70 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v70-cicapt-packet-world-model-evidence
          path: garuda_v3/artifacts/v70_cicapt_packet_world_model/*.json
          if-no-files-found: error
          retention-days: 30
