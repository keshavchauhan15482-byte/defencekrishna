name: V113 Dridex acquisition freeze

on:
  push:
    branches: [feat/v113-dridex-fresh-one-shot]
    paths:
      - 'garuda_v3/artifacts/certification/v113/selection_freeze.json'
      - '.github/workflows/v113-dridex-acquisition-freeze.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen selection and candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('garuda_v3/artifacts/certification/v113/selection_freeze.json').read_text())
          assert p['status']=='SELECTED_BEFORE_ACQUISITION'
          assert p['external_holdout']['dataset']=='CTU-Malware-Capture-Botnet-326-1'
          assert p['external_holdout']['capture']=='2018-01-30_win10.pcap'
          assert p['external_holdout']['malware_family']=='Dridex'
          assert p['registered_candidate']['model_sha256']=='f063ae8c890f9e805c913c02c92b8174cc1d58552514484ea2ef723611258fed'
          assert p['registered_candidate']['support_gate_sha256']=='7006671148e0dba3be55a2fe27a2fd17d3a7ece030dbcddd599c7aaa7f5368c1'
          assert p['registered_candidate']['adapter_contract_sha256']=='2c48468ed2e608377c226137bb432ee85efb27cfcb4ba7052f893816976e2e8c'
          assert p['one_shot_gate']['minimum_supported_fraction']==0.5
          assert p['acquisition_policy']['packet_decode_during_acquisition'] is False
          PY
      - name: Download raw bytes only
        run: |
          mkdir -p /tmp/v113
          URL='https://mcfp.felk.cvut.cz/publicDatasets/CTU-Malware-Capture-Botnet-326-1/2018-01-30_win10.pcap'
          curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 1200 "$URL" -o /tmp/v113/2018-01-30_win10.pcap
          test -s /tmp/v113/2018-01-30_win10.pcap
      - name: Freeze size and hashes without decode
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          selection=json.loads(Path('garuda_v3/artifacts/certification/v113/selection_freeze.json').read_text())
          f=Path('/tmp/v113/2018-01-30_win10.pcap')
          def digest(name):
              h=hashlib.new(name)
              with f.open('rb') as x:
                  for b in iter(lambda:x.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          sha=digest('sha256'); md5=digest('md5')
          if sha in set(selection['quarantined_external_captures']):
              raise RuntimeError('Selected capture hash collides with a quarantined external holdout')
          acq={
            'schema_version':'v113-acquisition.1','status':'HASH_FROZEN_NO_DECODE',
            'dataset':selection['external_holdout']['dataset'],'capture':selection['external_holdout']['capture'],
            'source_url':selection['external_holdout']['source_url'],'bytes':f.stat().st_size,
            'sha256':sha,'md5':md5,'packet_records_decoded':False,
            'model_inference_performed':False,'labels_accessed':False
          }
          Path('garuda_v3/artifacts/certification/v113/acquisition_manifest.json').write_text(json.dumps(acq,indent=2)+'\n')
          prereg={
            'schema_version':'v113-prereg.1','status':'HASH_FROZEN_ONE_SHOT_ARMED',
            'claim_boundary':selection['claim_boundary'],
            'selected_after_active_commit':selection['selected_after_active_commit'],
            'evaluator_frozen_before_selection_commit':selection['evaluator_frozen_before_selection_commit'],
            'external_holdout':{**selection['external_holdout'],'bytes':acq['bytes'],'sha256':sha,'md5':md5},
            'registered_candidate':selection['registered_candidate'],
            'one_shot_gate':selection['one_shot_gate'],
            'acquisition':{
              'manifest':'garuda_v3/artifacts/certification/v113/acquisition_manifest.json',
              'packet_decode_had_occurred':False,'model_inference_had_occurred':False,
              'labels_had_been_accessed':False
            },
            'evaluation_permitted':True,
            'rerun_for_claim_improvement_permitted':False
          }
          Path('garuda_v3/artifacts/certification/v113/preregistration.json').write_text(json.dumps(prereg,indent=2)+'\n')
          print(json.dumps({'bytes':acq['bytes'],'sha256':sha,'md5':md5},indent=2))
          PY
      - name: Commit immutable acquisition freeze
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garuda_v3/artifacts/certification/v113/acquisition_manifest.json garuda_v3/artifacts/certification/v113/preregistration.json
          git commit -m 'evidence(v113): hash-freeze Dridex capture before decode'
          git push origin "HEAD:${GITHUB_REF_NAME}"
