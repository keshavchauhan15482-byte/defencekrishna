name: V77 frozen unseen-subtype stage benchmark

on:
  push:
    branches: [feat/v67-ps9plus-evidence]
    paths:
      - 'garuda_v3/v77_unseen_subtype_stage_benchmark.py'
      - 'garuda_v3/config/v77_unseen_subtype_stage_freeze.json'
      - '.github/workflows/v77-unseen-subtype-stage-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile V77
        run: python -m compileall -q garuda_v3/v77_unseen_subtype_stage_benchmark.py
      - name: Download hash-checked X-IIoTID
        run: |
          mkdir -p datasets/v77
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(f'Expected one X-IIoTID source, got {matches}')
          dst=Path('datasets/v77/XIIoTID.csv')
          shutil.copyfile(matches[0],dst)
          h=hashlib.sha256()
          with dst.open('rb') as f:
              for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
          freeze=json.loads(Path('garuda_v3/config/v77_unseen_subtype_stage_freeze.json').read_text())
          if h.hexdigest()!=freeze['dataset_sha256']:
              raise RuntimeError(f'Dataset hash mismatch {h.hexdigest()} != {freeze["dataset_sha256"]}')
          print({'dataset_sha256':h.hexdigest(),'freeze_run':freeze['frozen_from_support_only_run']})
          PY
      - name: Run V77 three-seed frozen benchmark
        run: |
          python -m garuda_v3.v77_unseen_subtype_stage_benchmark \
            --csv datasets/v77/XIIoTID.csv \
            --freeze garuda_v3/config/v77_unseen_subtype_stage_freeze.json \
            --output garuda_v3/artifacts/v77_unseen_subtype_stage \
            --seeds 42 43 44 \
            --epochs 18
      - name: Verify leakage and freeze contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v77_unseen_subtype_stage/summary.json').read_text())
          c=d['leakage_contract']
          assert c['reserve_subtype_sequences_used_for_world_model_development'] is False
          assert c['reserve_subtype_sequences_used_for_stage_mapper_development'] is False
          assert c['same_source_overlapping_neighbours_allowed_in_development'] is False
          assert c['test_metrics_used_for_reserve_selection'] is False
          assert c['attack_labels_are_world_model_inputs'] is False
          assert c['stage_mapper_fit_on_test'] is False
          assert c['world_model_fit_on_test'] is False
          s=d['summary']
          assert s['seed_evaluations']==3
          assert s['selected_stage_count']==2
          assert d['split_contract']['reserve_test_support']=={'Reconnaissance':182,'Lateral Movement':595}
          print(json.dumps(s,indent=2))
          PY
      - name: Upload V77 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v77-unseen-subtype-stage-evidence
          path: garuda_v3/artifacts/v77_unseen_subtype_stage/*.json
          if-no-files-found: error
          retention-days: 30
