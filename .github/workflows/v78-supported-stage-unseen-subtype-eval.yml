name: V78 supported-stage unseen subtype evaluation

on:
  push:
    branches: [feat/v67-ps9plus-evidence]
    paths:
      - 'garuda_v3/v76f_supported_stage_subtype_freeze.py'
      - 'garuda_v3/v78_supported_stage_unseen_subtype_eval.py'
      - '.github/workflows/v78-supported-stage-unseen-subtype-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v78:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile V76f and V78
        run: |
          python -m compileall -q \
            garuda_v3/v76_stage_subtype_support_freeze.py \
            garuda_v3/v76f_supported_stage_subtype_freeze.py \
            garuda_v3/v78_supported_stage_unseen_subtype_eval.py
      - name: Download X-IIoTID
        run: |
          mkdir -p datasets/v78
          python - <<'PY'
          import shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(f'Expected one X-IIoTID source, got {matches}')
          shutil.copyfile(matches[0],Path('datasets/v78/XIIoTID.csv'))
          PY
      - name: Freeze maximal supportable holdouts before model scoring
        run: |
          mkdir -p garuda_v3/artifacts/v78_supported_stage_unseen_subtype
          python -m garuda_v3.v76f_supported_stage_subtype_freeze \
            --csv datasets/v78/XIIoTID.csv \
            --output garuda_v3/artifacts/v78_supported_stage_unseen_subtype/freeze.json
      - name: Seal support-only freeze
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('garuda_v3/artifacts/v78_supported_stage_unseen_subtype/freeze.json')
          d=json.loads(p.read_text())
          assert d['selection_used_model_metrics'] is False
          assert d['model_scored_reserve_before_freeze'] is False
          assert d['selected_stage_count'] >= 1
          assert d['fine_subtype_column'].lower()=='class1'
          assert d['lifecycle_family_column'].lower()=='class2'
          assert d['binary_label_column'].lower()=='class3'
          print('FREEZE_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          print(json.dumps({
            'selected_stage_count':d['selected_stage_count'],
            'selected_stages':d['selected_stages'],
            'selected':d['selected_reserve_subtype_by_stage'],
            'reserve_support':d['reserve_stage_support'],
            'clean_onset_diagnostic':d['clean_onset_support_diagnostic_only'],
            'development_support':d['development_stage_support_after_all_reserves'],
            'unsupported':d['unsupported_stage_audit']
          },indent=2))
          PY
      - name: Run V78 three-seed model evaluation
        run: |
          python -m garuda_v3.v78_supported_stage_unseen_subtype_eval \
            --csv datasets/v78/XIIoTID.csv \
            --freeze garuda_v3/artifacts/v78_supported_stage_unseen_subtype/freeze.json \
            --output garuda_v3/artifacts/v78_supported_stage_unseen_subtype/results \
            --seeds 42 43 44 \
            --epochs 18
      - name: Verify leakage contract and exact evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v78_supported_stage_unseen_subtype/results/summary.json').read_text())
          c=d['leakage_contract']
          assert c['reserve_selection_used_model_metrics'] is False
          assert c['reserve_scored_before_freeze'] is False
          assert c['reserve_subtypes_seen_by_world_model_fit'] is False
          assert c['reserve_subtypes_seen_by_world_validation'] is False
          assert c['reserve_subtypes_seen_by_stage_mapper_fit'] is False
          assert c['attack_labels_are_world_model_inputs'] is False
          assert c['test_used_for_world_blend_selection'] is False
          assert c['test_used_for_stage_mapper_fit'] is False
          assert c['source_local_overlap_embargo_applied'] is True
          assert c['clean_onset_claim'] is False
          assert c['pre_compromise_claim'] is False
          assert len(d['seeds'])==3
          assert d['summary']['evaluated_stage_count']==len(d['selected_stages'])
          print(json.dumps({
            'selected':d['selected_reserve_subtype_by_stage'],
            'unsupported':d['unsupported_stage_audit'],
            'split':d['split'],
            'per_stage':d['per_stage_summary'],
            'summary':d['summary']
          },indent=2))
          for seed,row in d['seeds'].items():
              print('\nSEED',seed)
              print(json.dumps(row['forecast_state_stage_metrics'],indent=2))
          PY
      - name: Upload V78 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v78-supported-stage-unseen-subtype-evidence
          path: garuda_v3/artifacts/v78_supported_stage_unseen_subtype/**/*.json
          if-no-files-found: error
          retention-days: 30
