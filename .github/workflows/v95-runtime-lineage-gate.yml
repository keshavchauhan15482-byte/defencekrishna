name: V95 runtime lineage evidence gate

on:
  push:
    branches:
      - feat/v67-ps9plus-evidence
    paths:
      - 'garuda_v3/v95_runtime_lineage_gate.py'
      - 'garuda_v3/v95_rebuild_runtime_provenance.py'
      - 'garuda_v3/runtime_provenance.py'
      - 'garuda_v3/tests/test_v95_runtime_lineage_gate.py'
      - 'garuda_v3/artifacts/certification/v95/runtime_lineage_manifest.json'
      - 'garuda_v3/active_runtime_bundle.json'
      - 'garuda_v3/artifacts/residual_run/metrics.json'
      - 'garuda_v3/artifacts/residual_run/support_gate.json'
      - 'garuda_v3/artifacts/residual_run/lineage_provenance.json'
      - 'garuda_v3/artifacts/Thursday.npz'
      - 'garuda_v3/artifacts/Friday.npz'
      - '.github/workflows/v95-runtime-lineage-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal provenance dependency
        run: python -m pip install 'numpy>=1.24'
      - name: Reconstruct support provenance from recorded active inputs
        run: |
          python -m garuda_v3.v95_rebuild_runtime_provenance --root .
      - name: Run V95 verifier tests
        run: python -m unittest garuda_v3.tests.test_v95_runtime_lineage_gate
      - name: Enforce real V95 PASS after deterministic reconstruction
        run: |
          python -m garuda_v3.v95_runtime_lineage_gate \
            --root . \
            --output garuda_v3/artifacts/certification/v95/runtime_lineage_report.json \
            --require-pass
          cat garuda_v3/artifacts/certification/v95/runtime_lineage_report.json
      - name: Commit generated lineage evidence when changed
        run: |
          git config user.name 'garuda-evidence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            garuda_v3/active_runtime_bundle.json \
            garuda_v3/artifacts/residual_run/support_gate.json \
            garuda_v3/artifacts/residual_run/lineage_provenance.json \
            garuda_v3/artifacts/certification/v95/runtime_lineage_manifest.json
          if git diff --cached --quiet; then
            echo 'V95 lineage artifacts already reproducible and pinned.'
          else
            git commit -m 'evidence(v95): pin reconstructed runtime support lineage'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload V95 audit report
        uses: actions/upload-artifact@v4
        with:
          name: v95-runtime-lineage-report
          path: garuda_v3/artifacts/certification/v95/runtime_lineage_report.json
