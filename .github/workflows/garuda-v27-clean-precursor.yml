name: Garuda V27 Clean-History Precursor Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-precursor-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V27 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' 'scikit-learn<1.7'
      - name: Verify frozen V27 protocol
        run: |
          python - <<'PY'
          import json
          p=json.load(open('garuda_v3/experiments/v27/V27_PROTOCOL_FREEZE.json'))
          assert p['frozen_before_v27_results'] is True
          assert p['model']['attack_in_history_training_allowed'] is False
          assert p['feature_policy']['strict_network_only'] is True
          print('V27 frozen protocol: PASS')
          PY
      - name: Reproduce V27 failed clean-history precursor gate
        continue-on-error: true
        working-directory: garuda_v3/experiments/v27
        run: python v27_iot23_clean_precursor.py
      - name: Upload V27 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garuda-v27-clean-precursor-evidence
          path: garuda_v3/experiments/v27/artifacts/iot23_clean_precursor/
          if-no-files-found: warn
