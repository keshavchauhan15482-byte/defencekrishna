name: Garuda V28 Multi-Horizon Unseen Forecast Development

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multihorizon-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V28 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' 'scikit-learn<1.7'
      - name: Verify V28 protocol freeze
        run: |
          python - <<'PY'
          import json
          p=json.load(open('garuda_v3/experiments/v28/V28_PROTOCOL_FREEZE.json'))
          assert p['frozen_before_v28_results'] is True
          assert p['temporal_protocol']['training_population'] == 'fully benign 8-minute histories only'
          assert p['feature_policy']['strict_network_only'] is True
          assert p['model']['attack_in_history_training_allowed'] is False
          assert p['model']['evaluation_never_selects_model_or_threshold'] is True
          assert 'locked' in p['final_validation']
          print('V28 protocol freeze: PASS')
          PY
      - name: Run V28 multi-horizon clean-history forecaster
        working-directory: garuda_v3/experiments/v28
        run: python v28_iot23_multihorizon.py
      - name: Upload V28 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garuda-v28-multihorizon-evidence
          path: garuda_v3/experiments/v28/artifacts/iot23_multihorizon/
          if-no-files-found: warn
