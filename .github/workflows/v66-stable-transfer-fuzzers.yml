name: V66 stable transfer Fuzzers holdout

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v66-stable-transfer
    paths:
      - 'garuda_v3/v66_stable_transfer_fuzzers.py'
      - 'docs/release/v66_stable_transfer/precommit.json'
      - '.github/workflows/v66-stable-transfer-fuzzers.yml'

jobs:
  stable-fuzzers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile V66
        run: python -m compileall -q garuda_v3/v66_stable_transfer_fuzzers.py
      - name: Verify precommit exists before dataset/model execution
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('docs/release/v66_stable_transfer/precommit.json')
          d=json.loads(p.read_text())
          assert d['fresh_reserve']['family']=='fuzzers'
          assert d['fresh_reserve']['campaign_cutoff']==1424257500
          assert d['fresh_reserve']['reserve_scores_seen_before_this_precommit'] is False
          print('precommit_sha256', hashlib.sha256(p.read_bytes()).hexdigest())
          print(json.dumps(d['stability_change'], indent=2))
          PY
      - name: Download UNSW-NB15
        run: |
          mkdir -p datasets/v66
          python - <<'PY'
          from pathlib import Path
          import kagglehub
          root=Path(kagglehub.dataset_download('mrwellsdavid/unsw-nb15'))
          Path('datasets/v66/root.txt').write_text(str(root))
          print(root)
          for p in sorted(root.rglob('UNSW-NB15_[1-4].csv')):
              print(p.name, p.stat().st_size)
          PY
      - name: Run precommitted stable-transfer Fuzzers benchmark
        run: |
          ROOT=$(cat datasets/v66/root.txt)
          python -m garuda_v3.v66_stable_transfer_fuzzers \
            --dataset-root "$ROOT" \
            --output garuda_v3/artifacts/v66_fuzzers \
            --seeds 42 43 44 \
            --epochs 18
      - name: Verify leakage and uncertainty contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v66_fuzzers/summary.json').read_text())
          f=json.loads(Path('garuda_v3/artifacts/v66_fuzzers/frozen_config.json').read_text())
          assert d['fresh_reserve']['campaign_cutoff']==1424257500
          assert f['fresh_reserve_family']=='fuzzers'
          assert f['reserve_metrics_used_for_selection'] is False
          assert d['precommit']['reserve_scores_seen_before_precommit'] is False
          for seed,row in d['fresh_reserve']['seeds'].items():
              assert {'tp','fp','tn','fn'} <= set(row['confusion'])
              assert 'recall_wilson95' in row['test']
              assert 'fpr_wilson95' in row['test']
          print(json.dumps(d['fresh_reserve']['summary'], indent=2))
          PY
      - name: Upload V66 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v66-stable-transfer-fuzzers-evidence
          path: garuda_v3/artifacts/v66_fuzzers/*.json
          if-no-files-found: warn
          retention-days: 30
