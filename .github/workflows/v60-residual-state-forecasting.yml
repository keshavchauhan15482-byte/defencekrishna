name: V60 residual state forecasting diagnostic

on:
  push:
    branches: [fix/v57-metric-strengthening]
    paths:
      - 'garuda_v3/v60_residual_state_forecasting.py'
      - '.github/workflows/v60-residual-state-forecasting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-state:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile V60
        run: python -m compileall -q garuda_v3/v60_residual_state_forecasting.py
      - name: Download X-IIoTID
        run: |
          mkdir -p datasets/v60
          python - <<'PY'
          import shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(f'Expected one source, got {matches}')
          shutil.copyfile(matches[0],Path('datasets/v60/XIIoTID.csv'))
          PY
      - name: Run RDoS state diagnostic
        run: |
          python -m garuda_v3.v60_residual_state_forecasting \
            --csv datasets/v60/XIIoTID.csv \
            --output garuda_v3/artifacts/v60_rdos \
            --holdout-family rdos \
            --seeds 42 43 44 \
            --epochs 18
      - name: Print summary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('garuda_v3/artifacts/v60_rdos/summary.json'))
          print(json.dumps({'support':d['support'],'summary':d['summary']},indent=2))
          PY
      - name: Upload V60 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v60-residual-state-evidence
          retention-days: 14
          if-no-files-found: error
          path: garuda_v3/artifacts/v60_rdos/*.json
