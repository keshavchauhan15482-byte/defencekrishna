name: V107 evidence integrity contracts

on:
  push:
    branches: [feat/v107-stage-packet-v98-integrity-refresh]
    paths:
      - 'garuda_v3/v107_precompromise_evidence_validator.py'
      - 'garuda_v3/tests/test_v107_precompromise_evidence_validator.py'
      - '.github/workflows/v107-integrity-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test runtime
        run: python -m pip install 'numpy<2.1' pytest
      - name: Compile and test fail-closed V98 validator
        run: |
          python -m compileall -q garuda_v3/v107_precompromise_evidence_validator.py
          python -m pytest -q garuda_v3/tests/test_v107_precompromise_evidence_validator.py
