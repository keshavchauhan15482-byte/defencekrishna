name: V47 unseen-family open-set diagnostic

on:
  pull_request:
    paths:
      - 'garuda_v3/v47_unseen_family.py'
      - 'garuda_v3/v47_leave_one_family.py'
      - 'garuda_v3/tests/test_v47_unseen_family.py'
      - '.github/workflows/v47-unseen-family.yml'
      - 'V47_UNSEEN_FAMILY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unseen-family:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install V47 research dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile and run leakage/unit tests
        run: |
          python -m compileall -q garuda_v3/v47_unseen_family.py garuda_v3/v47_leave_one_family.py
          python -m unittest garuda_v3.tests.test_v47_unseen_family -v
      - name: Download public X-IIoTID source
        run: |
          mkdir -p datasets/v47
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          import pandas as pd
          import kagglehub
          root = Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches = []
          for p in root.rglob('*.csv'):
              try:
                  cols = pd.read_csv(p, nrows=0).columns
              except Exception:
                  continue
              normalized = {''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'} <= normalized:
                  matches.append(p)
          if len(matches) != 1:
              raise RuntimeError(f'Expected exactly one X-IIoTID CSV with class1/class2/class3; found {matches}')
          src = matches[0]
          dst = Path('datasets/v47/XIIoTID.csv')
          shutil.copyfile(src, dst)
          print(json.dumps({'source': str(src), 'destination': str(dst), 'bytes': dst.stat().st_size}))
          PY
      - name: Run strict chronological pre-onset support audit
        run: |
          python -m garuda_v3.v47_unseen_family \
            --csv datasets/v47/XIIoTID.csv \
            --output garuda_v3/artifacts/v47_pre_onset \
            --seeds 42 43 44 \
            --epochs 12 \
            --max-families 5 \
            --min-test-positives 10 \
            --min-test-negatives 50
      - name: Run three-seed leave-one-family-out generalisation benchmark
        run: |
          python -m garuda_v3.v47_leave_one_family \
            --csv datasets/v47/XIIoTID.csv \
            --output garuda_v3/artifacts/v47_leave_one_family \
            --seeds 42 43 44 \
            --epochs 12 \
            --max-families 5 \
            --min-test-positives 20 \
            --min-test-negatives 50
      - name: Print compact result summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pre = json.loads(Path('garuda_v3/artifacts/v47_pre_onset/summary.json').read_text())
          loo = json.loads(Path('garuda_v3/artifacts/v47_leave_one_family/summary.json').read_text())
          print(json.dumps({
            'strict_pre_onset': {
              'selected_families': pre['family_selection']['selected'],
              'claim_boundary': pre['claim_boundary'],
            },
            'leave_one_family_out': {
              'network_features': loo['network_only_feature_audit']['raw_selected'],
              'selected_families': loo['family_selection']['selected'],
              'summaries': {k: v['summary'] for k, v in loo['families'].items()},
              'pre_onset_claim_supported': loo['pre_onset_claim_supported'],
              'all_selected_unseen_family_gates_passed': loo['all_selected_unseen_family_gates_passed'],
            },
          }, indent=2))
          PY
      - name: Upload V47 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v47-unseen-family-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            garuda_v3/artifacts/v47_pre_onset/*.json
            garuda_v3/artifacts/v47_leave_one_family/*.json
