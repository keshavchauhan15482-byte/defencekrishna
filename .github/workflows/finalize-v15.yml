name: Finalize V15 integration branch

on:
  push:
    branches: [garuda-v15-system-integration]
    paths:
      - 'finalize-v15.trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garuda-v15-system-integration
          fetch-depth: 0
      - name: Expose integrated status and refresh README
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          server=Path('garuda_v3/server.py')
          s=server.read_text()
          old="            if url.path=='/api/status':return self.respond(200,dict(role=role,model=app.service.meta,model_sha256=app.service.model_hash,policies=app.policy.active(),audit_integrity=app.policy.verify(),enforcement_enabled=app.policy.enforce))"
          new="""            if url.path=='/api/status':
                status=dict(role=role,model=app.service.meta,model_sha256=app.service.model_hash,policies=app.policy.active(),audit_integrity=app.policy.verify(),enforcement_enabled=app.policy.enforce)
                if hasattr(app,'integrated_status'):status.update(app.integrated_status())
                status['role']=role
                return self.respond(200,status)"""
          if old not in s:
              raise SystemExit('Expected /api/status line not found')
          server.write_text(s.replace(old,new,1))

          readme=Path('README.md')
          r=readme.read_text()
          marker='## V12 measured risk-readout experiment\n'
          prefix="""## V15 integrated Krishna Defence System

See [V15_SYSTEM_INTEGRATION_RESULTS.md](V15_SYSTEM_INTEGRATION_RESULTS.md) for the measured system integration. Garuda V15 is now part of the real Krishna Defence forecast/response path as the latest X-IIoTID evidence and a fail-closed response-policy gate. Start the integrated local demo with `npm run demo:v15`.

Important boundary: the live compatible runtime remains the hash-checked Garuda v3 10-second graph forecaster. V15 was evaluated on 60-second X-IIoTID host-minute telemetry and still needs a strict network-only audit plus a schema-compatible checkpoint export before it can honestly replace that runtime model. Current V15 unknown-forecast containment therefore remains shadow-only. Arjuna reviewed/known enforcement and operator-scoped Sudarshana lab controls retain their separately tested behavior.

Fresh V15 X-IIoTID evidence: LSTM three-seed mean recall **86.09%** with **0 false positives observed among 1,366 benign test sequences per seed** on this finite chronological holdout; GraphSAGE-style+LSTM mean observed FPR **0.7565%** and recall **80.00%**. The untouched test has zero clean-history future-positive examples, so verified pre-compromise warning is not claimed.

## Historical V12 measured risk-readout experiment
"""
          if marker not in r:
              raise SystemExit('README V12 heading not found')
          r=r.replace(marker,prefix,1)
          r=r.replace('> Latest experiment and autoplay update: [V8_RESULTS.md](V8_RESULTS.md).', '> Historical V8 experiment and autoplay update: [V8_RESULTS.md](V8_RESULTS.md).',1)
          r=r.replace('> Latest core-pipeline work: read [CORE_UPGRADE_RESULTS.md](CORE_UPGRADE_RESULTS.md)', '> Historical core-pipeline work: read [CORE_UPGRADE_RESULTS.md](CORE_UPGRADE_RESULTS.md)',1)
          readme.write_text(r)
          PY
          python -m py_compile garuda_v3/server.py
          grep -q "V15 integrated Krishna Defence System" README.md
      - name: Remove one-shot migration helpers
        run: |
          rm -f .github/workflows/import-v15-source.yml .github/workflows/v15-ui-patch.yml
          rm -f import-v15-source.trigger v15-ui-patch.trigger
          rm -f .github/workflows/finalize-v15.yml finalize-v15.trigger
      - name: Commit final integrated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Garuda V15 system integration'
          git push origin garuda-v15-system-integration
