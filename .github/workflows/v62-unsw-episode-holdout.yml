name: V62 UNSW episode holdout audit

on:
  push:
    branches: [fix/v57-metric-strengthening]
    paths:
      - 'garuda_v3/v62_unsw_episode_holdout.py'
      - 'garuda_v3/v60_residual_state_forecasting.py'
      - 'garuda_v3/v59_unsw_independent_replication.py'
      - 'garuda_v3/v57_metric_strengthening.py'
      - 'docs/release/v57_metric_strengthening/frozen_config.json'
      - '.github/workflows/v62-unsw-episode-holdout.yml'
  workflow_dispatch:

jobs:
  episode-holdout:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile V62
        run: python -m compileall -q garuda_v3/v62_unsw_episode_holdout.py
      - name: Download UNSW-NB15
        run: |
          mkdir -p datasets/v62
          python - <<'PY'
          from pathlib import Path
          import kagglehub
          root=Path(kagglehub.dataset_download('mrwellsdavid/unsw-nb15'))
          Path('datasets/v62/root.txt').write_text(str(root))
          print(root)
          for p in sorted(root.rglob('UNSW-NB15_[1-4].csv')):
              print(p.name, p.stat().st_size)
          PY
      - name: Run support-selected unseen-family episode audit
        run: |
          ROOT=$(cat datasets/v62/root.txt)
          python -m garuda_v3.v62_unsw_episode_holdout \
            --dataset-root "$ROOT" \
            --frozen-config docs/release/v57_metric_strengthening/frozen_config.json \
            --output garuda_v3/artifacts/v62_unsw_episode \
            --seeds 42 43 44 \
            --epochs 18 \
            --max-audits 2
      - name: Verify audit contract and print result
        run: |
          python - <<'PY'
          import json
          p='garuda_v3/artifacts/v62_unsw_episode/summary.json'
          d=json.load(open(p))
          assert d['fusion_reused_without_selection'] is True
          assert d['unsw_metrics_used_for_fusion_selection'] is False
          assert d['episode_selection_uses_model_metrics'] is False
          print(json.dumps({
              'selected':d['selected_audits'],
              'summary':{r['family']:r['summary'] for r in d['results']},
          }, indent=2))
          PY
      - name: Upload V62 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v62-unsw-episode-holdout-evidence
          path: garuda_v3/artifacts/v62_unsw_episode/*.json
          retention-days: 14
          if-no-files-found: error
