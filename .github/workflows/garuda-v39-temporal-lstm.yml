name: Garuda V39 Invariant Temporal LSTM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v39-temporal-lstm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V39 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' 'scikit-learn<1.7'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
      - name: Verify V39 frozen protocol
        run: |
          python - <<'PY'
          import json
          p=json.load(open('garuda_v3/experiments/v39/V39_PROTOCOL_FREEZE.json'))
          assert p['frozen_before_v39_results'] is True
          assert p['representation']['shape'] == [7,12]
          assert p['pre_forecast_invariance_gate']['mean_domain_roc_auc_max'] == 0.70
          assert p['models']['primary']['type'] == 'PyTorch LSTM'
          assert p['models']['seeds'] == [42,43,44]
          assert p['models']['test_information_used_for_model_or_threshold_selection'] is False
          assert set(p['devices']['development_only']).isdisjoint(p['devices']['excluded_v35_inspected_devices'])
          assert p['final_validation'] == 'locked and external/new'
          print('V39 protocol freeze: PASS')
          PY
      - name: Syntax-check V39
        run: python -m py_compile garuda_v3/experiments/v39/v39_unsw_temporal_lstm.py
      - name: Run V39 invariant temporal LSTM forecast
        working-directory: garuda_v3/experiments/v39
        run: python v39_unsw_temporal_lstm.py
      - name: Upload V39 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garuda-v39-temporal-lstm-evidence
          path: garuda_v3/experiments/v39/artifacts/unsw_temporal_lstm/
          if-no-files-found: warn
