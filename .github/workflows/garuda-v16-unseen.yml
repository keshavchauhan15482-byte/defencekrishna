name: Garuda Unseen-Family Forecast Development

on:
  pull_request:
    branches: [main]
    paths:
      - 'garuda_v3/experiments/v16/**'
      - 'garuda_v3/tests/test_v16_unseen.py'
      - '.github/workflows/garuda-v16-unseen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unseen-forecast-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
      - name: Run unseen protocol tests
        run: python -m unittest garuda_v3.tests.test_v16_unseen -v
      - name: Run V21 generic microstructure OOD development experiment
        working-directory: garuda_v3/experiments/v16
        run: python v21_dev_microstructure_ood.py
      - name: Upload V21 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garuda-v21-dev-evidence
          path: garuda_v3/experiments/v16/artifacts/v21_dev/
          if-no-files-found: warn
