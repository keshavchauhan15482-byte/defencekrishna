name: Garuda V16 Unseen-Family Forecast

on:
  pull_request:
    branches: [main]
    paths:
      - 'garuda_v3/experiments/v16/**'
      - 'garuda_v3/tests/test_v16_unseen.py'
      - '.github/workflows/garuda-v16-unseen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unseen-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Run V16 protocol tests
        run: python -m unittest garuda_v3.tests.test_v16_unseen -v
      - name: Run unseen-family future forecasting experiment
        run: python garuda_v3/experiments/v16/v16_xiiotid_unseen_forecast.py
      - name: Upload V16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garuda-v16-unseen-evidence
          path: artifacts/v16/
          if-no-files-found: warn
