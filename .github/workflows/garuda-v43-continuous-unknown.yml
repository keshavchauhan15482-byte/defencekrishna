name: Garuda V43 Continuous Unknown Lane

on:
  pull_request:
    branches: [main]
    paths:
      - 'garuda_v3/experiments/v43/**'
      - '.github/workflows/garuda-v43-continuous-unknown.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v43-continuous-unknown:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V43 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' 'scikit-learn<1.7'
      - name: Verify frozen V43 protocol
        run: |
          python - <<'PY'
          import json
          p=json.load(open('garuda_v3/experiments/v43/V43_PROTOCOL_FREEZE.json'))
          assert p['frozen_before_results'] is True
          assert p['strict_network_only'] is True
          assert p['representation']['empirical_percentile_clipping'] is False
          assert p['decision_policy']['threshold_comparison'].startswith('strict greater-than')
          assert p['decision_policy']['test_information_used'] is False
          assert p['locked_final_validation_families'] == ['TcpSynDevice','UdpDevice']
          print('V43 protocol freeze: PASS')
          PY
      - name: Syntax-check V43
        run: python -m py_compile garuda_v3/experiments/v43/v43_continuous_unknown_lane.py
      - name: Run V43 continuous unknown lane
        working-directory: garuda_v3/experiments/v43
        run: python v43_continuous_unknown_lane.py
      - name: Upload V43 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garuda-v43-continuous-unknown-evidence
          path: garuda_v3/experiments/v43/artifacts/continuous_unknown_lane/
          if-no-files-found: warn
