name: V58 independent fresh-family holdout

on:
  push:
    branches: [fix/v57-metric-strengthening]
    paths:
      - 'garuda_v3/v58_independent_holdout.py'
      - '.github/workflows/v58-independent-holdout.yml'
      - 'docs/release/v55_joint_generalization/frozen_config.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile independent audit
        run: |
          python -m compileall -q garuda_v3/v58_independent_holdout.py
      - name: Download X-IIoTID
        run: |
          mkdir -p datasets/v58
          python - <<'PY'
          import shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(f'Expected one source, got {matches}')
          shutil.copyfile(matches[0],Path('datasets/v58/XIIoTID.csv'))
          PY
      - name: Run frozen V55 scorer on fresh family
        run: |
          python -m garuda_v3.v58_independent_holdout \
            --csv datasets/v58/XIIoTID.csv \
            --frozen-config docs/release/v55_joint_generalization/frozen_config.json \
            --output garuda_v3/artifacts/v58_independent \
            --seeds 42 43 44 \
            --epochs 12 \
            --holdout-families rdos
      - name: Verify audit contract and print result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('garuda_v3/artifacts/v58_independent/summary.json')
          d=json.loads(p.read_text())
          assert d['selection_reused_without_modification'] is True
          assert d['holdout_metrics_used_for_selection'] is False
          assert d['holdout_blocked_from_fit_calibration_policy'] is True
          prior=set(d['prior_v55_families'])
          hold=set(d['fresh_holdout_families'])
          assert not (prior & hold), (prior & hold)
          print(json.dumps({
              'fresh_holdout_families': d['fresh_holdout_families'],
              'joint': {k:v['summary'] for k,v in d['joint_holdout']['families'].items()}
          }, indent=2))
          PY
      - name: Upload independent evidence
        uses: actions/upload-artifact@v4
        with:
          name: v58-independent-fresh-family-evidence
          retention-days: 14
          if-no-files-found: error
          path: garuda_v3/artifacts/v58_independent/*.json
