name: V131 Garuda packet recovery
on:
  pull_request:
    branches: [main]
    paths:
      - garuda_v3/packet_recovery_v131.py
      - garuda_v3/tests/test_packet_recovery_v131.py
      - .github/workflows/packet-recovery-v131.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r garuda_v3/requirements.txt
      - run: python -m unittest garuda_v3.tests.test_packet_recovery_v131 garuda_v3.tests.test_pcap_tail_clean -v
      - name: Real 34-feature packet recovery and three-seed audit
        run: python -m garuda_v3.packet_recovery_v131 --output "$RUNNER_TEMP/v131"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v131-development-packet-evidence
          path: |
            ${{ runner.temp }}/v131/recovery_report.json
            ${{ runner.temp }}/v131/development_support_gate.json
            ${{ runner.temp }}/v131/split.json
            ${{ runner.temp }}/v131/*.integrity.json
            ${{ runner.temp }}/v131/seed-*/metrics.json
          if-no-files-found: warn
          retention-days: 14
