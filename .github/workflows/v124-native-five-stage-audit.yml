name: V124 native five-stage source audit

on:
  push:
    branches: [feat/v124-native-five-stage-certification]
    paths:
      - 'garuda_v3/v124_uwf_native_stage_audit.py'
      - '.github/workflows/v124-native-five-stage-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install audit dependencies
        run: python -m pip install --quiet 'pyarrow<19'
      - name: Run publisher-native label/schema audit
        run: |
          rm -rf /tmp/v124-uwf garuda_v3/artifacts/certification/v124
          python -m garuda_v3.v124_uwf_native_stage_audit \
            --cache-dir /tmp/v124-uwf \
            --output garuda_v3/artifacts/certification/v124/source_audit.json
      - name: Verify no-proxy evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('garuda_v3/artifacts/certification/v124/source_audit.json').read_text())
          assert r['schema_version']=='v124-source-audit.1'
          assert r['proxy_mapping_used'] is False
          assert r['discovery_mapped_to_reconnaissance'] is False
          assert r['exploitation_mapped_to_initial_access'] is False
          assert len(r['shards'])==8
          assert r['status'] in {'NATIVE_FIVE_STAGE_SOURCE_FOUND','NATIVE_FIVE_STAGE_SOURCE_INCOMPLETE'}
          print(json.dumps({'status':r['status'],'tactic_columns':r['tactic_candidate_columns'],'coverage':r['native_stage_coverage']},indent=2))
          PY
      - name: Record immutable source audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garuda_v3/artifacts/certification/v124/source_audit.json
          git commit -m 'evidence(v124): record UWF native five-stage source audit'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: v124-native-five-stage-source-audit
          path: garuda_v3/artifacts/certification/v124/source_audit.json
          if-no-files-found: error
          retention-days: 30
