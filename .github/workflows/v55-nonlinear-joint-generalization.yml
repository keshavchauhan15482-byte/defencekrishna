name: V55 nonlinear joint-family generalisation

on:
  push:
    branches: [fix/joint-family-generalization-v54]
    paths:
      - 'garuda_v3/v55_nonlinear_joint_generalization.py'
      - 'garuda_v3/tests/test_v55_nonlinear_joint_generalization.py'
      - '.github/workflows/v55-nonlinear-joint-generalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonlinear-joint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile and test V55
        run: |
          python -m compileall -q garuda_v3/v55_nonlinear_joint_generalization.py
          python -m unittest garuda_v3.tests.test_v54_joint_family_generalization garuda_v3.tests.test_v55_nonlinear_joint_generalization -v
      - name: Download X-IIoTID
        run: |
          mkdir -p datasets/v55
          python - <<'PY'
          import shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(f'Expected one source, got {matches}')
          shutil.copyfile(matches[0],Path('datasets/v55/XIIoTID.csv'))
          PY
      - name: Run V55 nonlinear pair-selected joint regression
        run: |
          python -m garuda_v3.v55_nonlinear_joint_generalization \
            --csv datasets/v55/XIIoTID.csv \
            --output garuda_v3/artifacts/v55 \
            --seeds 42 43 44 \
            --epochs 12 \
            --reserve-families exploitation 'c&c'
      - name: Print result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v55/summary.json').read_text())
          print(json.dumps({'frozen_config':d['frozen_config'], 'joint':{k:v['summary'] for k,v in d['joint_reserve_regression']['families'].items()}},indent=2))
          PY
      - name: Upload V55 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v55-nonlinear-joint-generalization-evidence
          retention-days: 14
          if-no-files-found: error
          path: garuda_v3/artifacts/v55/*.json
