name: V79 fresh subtype freeze

on:
  push:
    branches: [feat/v67-ps9plus-evidence]
    paths:
      - 'garuda_v3/v79_fresh_subtype_freeze.py'
      - '.github/workflows/v79-fresh-subtype-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
      - name: Compile V79
        run: python -m compileall -q garuda_v3/v79_fresh_subtype_freeze.py
      - name: Download X-IIoTID
        run: |
          mkdir -p datasets/v79
          python - <<'PY'
          import shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(f'Expected one X-IIoTID source, got {matches}')
          shutil.copyfile(matches[0],Path('datasets/v79/XIIoTID.csv'))
          PY
      - name: Freeze fresh reserve subtypes using support only
        run: |
          mkdir -p garuda_v3/artifacts/v79_fresh_subtype_freeze
          python -m garuda_v3.v79_fresh_subtype_freeze \
            --csv datasets/v79/XIIoTID.csv \
            --output garuda_v3/artifacts/v79_fresh_subtype_freeze/freeze.json
      - name: Seal freshness and no-model contract
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('garuda_v3/artifacts/v79_fresh_subtype_freeze/freeze.json')
          d=json.loads(p.read_text())
          assert d['selection_used_model_metrics'] is False
          assert d['model_scored_reserve_before_freeze'] is False
          assert d['previously_scored_subtypes_excluded_from_selection'] is True
          old=d['previously_scored_v78_subtype_by_stage']
          new=d['selected_reserve_subtype_by_stage']
          for stage,sub in new.items():
              assert old.get(stage)!=sub, (stage,sub)
          assert d['selected_stage_count']==len(d['selected_stages'])==len(new)
          assert d['selected_stage_count']>=1
          print('V79_FREEZE_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          print(json.dumps({
            'excluded_exposed':old,
            'selected_stages':d['selected_stages'],
            'selected':new,
            'reserve_support':d['reserve_stage_support'],
            'clean_onset_diagnostic':d['clean_onset_support_diagnostic_only'],
            'development_support':d['development_stage_support_after_all_reserves'],
            'unsupported':d['unsupported_stage_audit']
          },indent=2))
          PY
      - name: Upload immutable V79 freeze
        uses: actions/upload-artifact@v4
        with:
          name: v79-fresh-subtype-freeze
          path: garuda_v3/artifacts/v79_fresh_subtype_freeze/freeze.json
          if-no-files-found: error
          retention-days: 30
