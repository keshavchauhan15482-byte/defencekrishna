name: Garuda V36 UNSW Device-Invariance Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v36-domain-shift-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V36 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' 'scikit-learn<1.7'
      - name: Verify V36 frozen diagnostic protocol
        run: |
          python - <<'PY'
          import json
          p=json.load(open('garuda_v3/experiments/v36/V36_PROTOCOL_FREEZE.json'))
          assert p['frozen_before_v36_results'] is True
          assert p['audit_only'] is True
          assert p['attack_forecast_model_training'] is False
          assert p['attack_threshold_selection'] is False
          assert p['diagnostics']['benign_domain_shift']['population'].startswith('V35 clean-history negative')
          assert 'no longer untouched' in p['v35_test_reuse_boundary']
          assert 'locked' in p['final_validation']
          print('V36 protocol freeze: PASS')
          PY
      - name: Syntax-check V36
        run: python -m py_compile garuda_v3/experiments/v36/v36_unsw_domain_shift_audit.py
      - name: Run V36 benign-domain and label-overlap diagnostic
        working-directory: garuda_v3/experiments/v36
        run: python v36_unsw_domain_shift_audit.py
      - name: Upload V36 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garuda-v36-domain-shift-evidence
          path: garuda_v3/experiments/v36/artifacts/unsw_domain_shift_audit/
          if-no-files-found: warn
