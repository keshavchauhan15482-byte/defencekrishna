name: V102 MAWI acquisition-only hash freeze

on:
  push:
    branches: [feat/v102-mawi-preregister]
    paths:
      - 'garuda_v3/v102_mawi_acquire.py'
      - 'garuda_v3/artifacts/certification/v102/preregistration.json'
      - '.github/workflows/v102-mawi-acquisition-freeze.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquisition-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify preregistration is fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('garuda_v3/artifacts/certification/v102/preregistration.json')
          d=json.loads(p.read_text())
          assert d['schema_version']=='v102-prereg.1'
          assert d['status']=='ACQUISITION_ONLY_HASH_PENDING'
          assert d['evaluation_permitted'] is False
          assert d['external_holdout']['capture_id']=='200601011400'
          assert d['external_holdout']['compressed_filename']=='200601011400.dump.gz'
          assert d['external_holdout']['compressed_sha256'] is None
          assert d['external_holdout']['decompressed_sha256'] is None
          assert d['external_holdout']['freshness_audit']['prior_repository_use_found'] is False
          assert d['registered_candidate']['model_sha256']=='30694adf0819e6ffd79079512a348059195dcc651d7f0b4d5049e278b4d7cb79'
          assert d['registered_candidate']['support_gate_sha256']=='2f281593f163ba3e4bbed592ea41eeaa1c8d5e3dfe49de933473b15fe6c17df3'
          print('V102 preregistration is acquisition-only and fail-closed')
          PY

      - name: Download exact preregistered MAWI object
        run: |
          mkdir -p datasets/v102
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            --output datasets/v102/200601011400.dump.gz \
            'https://mawi.nezu.wide.ad.jp/mawi/samplepoint-B/2006/200601011400.dump.gz'
          test -s datasets/v102/200601011400.dump.gz

      - name: Freeze hashes without decoding packet records
        run: |
          python -m garuda_v3.v102_mawi_acquire \
            --prereg garuda_v3/artifacts/certification/v102/preregistration.json \
            --capture-gz datasets/v102/200601011400.dump.gz \
            --output garuda_v3/artifacts/certification/v102/acquisition_manifest.json

      - name: Verify no evaluation happened
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/certification/v102/acquisition_manifest.json').read_text())
          assert d['status']=='HASH_ACQUIRED_MODEL_NOT_RUN'
          assert d['evaluation_performed'] is False
          assert d['packet_records_decoded'] is False
          assert d['graph_windows_constructed'] is False
          assert d['support_scoring_performed'] is False
          assert d['model_inference_performed'] is False
          assert len(d['compressed_sha256'])==64
          assert len(d['decompressed_sha256'])==64
          assert d['pcap_global_header']['snaplen']==96
          assert d['pcap_global_header']['linktype'] in (1,101)
          print(json.dumps(d, indent=2, sort_keys=True))
          PY

      - name: Record acquisition manifest only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -f garuda_v3/artifacts/certification/v102/acquisition_manifest.json
          if git diff --cached --quiet; then
            echo "acquisition manifest was not staged; refusing to continue"
            exit 1
          fi
          git commit -m "evidence(v102): freeze MAWI source hashes before evaluation"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload acquisition manifest
        uses: actions/upload-artifact@v4
        with:
          name: v102-mawi-acquisition-manifest
          path: garuda_v3/artifacts/certification/v102/acquisition_manifest.json
          if-no-files-found: error
          retention-days: 30
