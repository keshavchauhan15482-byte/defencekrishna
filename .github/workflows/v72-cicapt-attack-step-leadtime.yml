name: V72 CICAPT attack-step onset lead-time audit

on:
  push:
    branches: [feat/v67-ps9plus-evidence]
    paths:
      - 'garuda_v3/v72_cicapt_attack_step_leadtime.py'
      - '.github/workflows/v72-cicapt-attack-step-leadtime.yml'
      - 'datasets/multisource/recovered/attack_info_axile.csv'
      - 'datasets/multisource/recovered/attack_info_axile_provenance.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attack-step-leadtime:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile V72
        run: python -m compileall -q garuda_v3/v72_cicapt_attack_step_leadtime.py
      - name: Fetch hash-verified CICAPT network captures
        run: |
          python -m garuda_v3.public_data_fetch \
            --catalogue datasets/multisource/catalogue.json \
            --root datasets/v72 \
            --ids cicapt_network \
            --extract
      - name: Run prospective attack-step onset audit
        run: |
          mkdir -p garuda_v3/artifacts/v72_cicapt_attack_step_leadtime
          python -m garuda_v3.v72_cicapt_attack_step_leadtime \
            --phase1 datasets/v72/1stPhase-timed-Merged.pcap \
            --phase2 datasets/v72/2ndPhase-timed-MergedV2.pcap \
            --timeline datasets/multisource/recovered/attack_info_axile.csv \
            --timeline-provenance datasets/multisource/recovered/attack_info_axile_provenance.json \
            --packet-limit 3000000 \
            --seeds 42 43 44 \
            --epochs 18 \
            --output garuda_v3/artifacts/v72_cicapt_attack_step_leadtime/summary.json
      - name: Verify no-leakage and claim-boundary contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v72_cicapt_attack_step_leadtime/summary.json').read_text())
          assert d['publisher_verified'] is False
          c=d['leakage_contract']
          assert c['phase2_used_for_training'] is False
          assert c['phase2_used_for_normalization'] is False
          assert c['phase2_used_for_blend_selection'] is False
          assert c['phase2_used_for_threshold_selection'] is False
          assert c['timeline_events_used_for_threshold_selection'] is False
          assert c['alert_score_uses_observed_future_ground_truth'] is False
          assert len(d['seeds'])==3
          assert 'NOT verified successful-compromise lead time' in d['claim_boundary']
          print(json.dumps(d['summary'],indent=2))
          for seed,row in d['seeds'].items():
              print(seed,json.dumps({
                'policy_alert_rate':row['phase1_policy_alert_rate'],
                'phase2_alert_rate':row['phase2_alert_rate'],
                'event_warning_recall':row['event_warning_recall'],
                'lead_seconds':row['lead_seconds'],
              },indent=2))
          PY
      - name: Upload V72 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v72-cicapt-attack-step-leadtime-evidence
          path: garuda_v3/artifacts/v72_cicapt_attack_step_leadtime/*.json
          if-no-files-found: error
          retention-days: 30
