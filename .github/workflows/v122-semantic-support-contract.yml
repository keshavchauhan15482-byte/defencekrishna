name: V122 semantic support contract

on:
  push:
    branches: [feat/v122-semantic-support-contract]
    paths:
      - 'garuda_v3/v122_semantic_support_contract.py'
      - '.github/workflows/v122-semantic-support-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependency
        run: python -m pip install 'numpy<2.1'
      - name: Verify semantic-support unit contract
        run: |
          python - <<'PY'
          import numpy as np
          from garuda_v3.v122_semantic_support_contract import semantic_decisions
          x=np.zeros((4,8,3,34),dtype=np.float32)
          m=np.ones((4,8,3),dtype=np.float32)
          x[...,29:]=1.0
          d=semantic_decisions(x,x.copy(),m)
          assert d['supported'].all()
          x_bad=x.copy(); x_bad[0,0,0,0]=np.nan
          d2=semantic_decisions(x_bad,x_bad.copy(),m)
          assert not d2['supported'][0]
          x_no_packet=x.copy(); x_no_packet[1,...,29]=0.0
          d3=semantic_decisions(x_no_packet,x_no_packet.copy(),m)
          assert not d3['supported'][1]
          print('V122 semantic support unit contract: PASS')
          PY
      - name: Fetch hash-pinned CICAPT development captures
        run: |
          python -m garuda_v3.public_data_fetch \
            --catalogue datasets/multisource/catalogue.json \
            --root datasets/v122 \
            --ids cicapt_network \
            --extract
      - name: Evaluate development-only semantic support contract
        run: |
          rm -rf garuda_v3/artifacts/certification/v122
          python -m garuda_v3.v122_semantic_support_contract \
            --phase1 datasets/v122/1stPhase-timed-Merged.pcap \
            --phase2 datasets/v122/2ndPhase-timed-MergedV2.pcap \
            --model garuda_v3/artifacts/certification/v116/gnn_lstm_raw_metric_relative_candidate.npz \
            --relative-transform garuda_v3/artifacts/certification/v116/relative_transform.json \
            --calibration garuda_v3/artifacts/certification/v118/innovation_calibration.json \
            --robust-support-gate garuda_v3/artifacts/certification/v120/robust_support_gate.json \
            --output-dir garuda_v3/artifacts/certification/v122 \
            --packet-limit 2000000
      - name: Verify fail-closed evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('garuda_v3/artifacts/certification/v122/summary.json').read_text())
          c=json.loads(Path('garuda_v3/artifacts/certification/v122/semantic_support_contract.json').read_text())
          assert r['schema_version']=='v122.1'
          assert r['status'] in {'DEV_SEMANTIC_SUPPORT_PASS','DEV_SEMANTIC_SUPPORT_FAIL'}
          assert r['behavior_shift_diagnostic']['hard_veto'] is False
          assert c['behavior_shift_diagnostic']['attack_or_ood_label'] is False
          assert c['provenance']['v121_bytes_read'] is False
          assert c['provenance']['v121_metrics_used_for_fit_or_thresholding'] is False
          assert c['provenance']['all_consumed_external_holdouts_excluded'] is True
          assert r['freeze']['new_external_holdout_selected'] is False
          if r['status']=='DEV_SEMANTIC_SUPPORT_PASS':
              assert r['recovery_gate_passed'] is True
              assert r['freeze']['candidate_runtime_frozen_before_new_external_selection'] is True
              assert all(r['gates'].values())
          else:
              assert r['recovery_gate_passed'] is False
              assert r['freeze']['candidate_runtime_frozen_before_new_external_selection'] is False
          print(json.dumps({'status':r['status'],'semantic':r['semantic_support'],'gates':r['gates'],'freeze':r['freeze']},indent=2))
          PY
      - name: Record immutable V122 development evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garuda_v3/artifacts/certification/v122
          git commit -m 'evidence(v122): record semantic support-contract development result'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v122-semantic-support-evidence
          path: garuda_v3/artifacts/certification/v122/*
          if-no-files-found: error
          retention-days: 30
