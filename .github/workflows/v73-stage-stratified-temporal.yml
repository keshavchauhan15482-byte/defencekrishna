name: V73 stage-stratified temporal benchmark

on:
  push:
    branches: [feat/v67-ps9plus-evidence]
    paths:
      - 'garuda_v3/v73_stage_stratified_temporal_holdout.py'
      - '.github/workflows/v73-stage-stratified-temporal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile V73
        run: python -m compileall -q garuda_v3/v73_stage_stratified_temporal_holdout.py
      - name: Download X-IIoTID
        run: |
          mkdir -p datasets/v73
          python - <<'PY'
          import shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(f'Expected one X-IIoTID source, got {matches}')
          shutil.copyfile(matches[0],Path('datasets/v73/XIIoTID.csv'))
          PY
      - name: Run five-stage temporal block benchmark
        run: |
          python -m garuda_v3.v73_stage_stratified_temporal_holdout \
            --csv datasets/v73/XIIoTID.csv \
            --output garuda_v3/artifacts/v73_stage_temporal \
            --seeds 42 43 44 \
            --epochs 18
      - name: Verify split and no-leakage contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v73_stage_temporal/summary.json').read_text())
          assert d['split_freeze']['selection_used_model_metrics'] is False
          c=d['leakage_contract']
          assert c['attack_labels_are_world_model_inputs'] is False
          assert c['stage_mapper_fit_on_test'] is False
          assert c['world_model_fit_on_test'] is False
          assert c['split_selected_by_model_metrics'] is False
          assert c['test_sequences_disjoint_from_train_and_validation'] is True
          assert c['per_stage_temporal_order_train_before_validation_before_test'] is True
          assert c['global_chronological_split'] is False
          assert d['stage_mapping']['Exploitation']=='Initial Access proxy'
          assert len(d['seeds'])==3
          print(json.dumps({'split':d['split_freeze']['stage_support'],'summary':d['summary']},indent=2))
          for seed,row in d['seeds'].items():
              print('\nSEED',seed)
              print(json.dumps(row['forecast_state_stage_metrics'],indent=2))
          PY
      - name: Upload V73 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v73-stage-temporal-evidence
          path: garuda_v3/artifacts/v73_stage_temporal/*.json
          if-no-files-found: error
          retention-days: 30
