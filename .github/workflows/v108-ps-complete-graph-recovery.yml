name: V108 PS-complete GraphSAGE recovery

on:
  push:
    branches: [feat/v108-ps-complete-graph-recovery]
    paths:
      - 'garuda_v3/model.py'
      - 'garuda_v3/v108_ps_complete_graph_recovery.py'
      - 'garuda_v3/tests/test_v108_ps_complete_graph_recovery.py'
      - '.github/workflows/v108-ps-complete-graph-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ps-complete-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install 'numpy<2.1' pytest
      - name: Verify V108 contracts
        run: |
          python -m compileall -q garuda_v3/model.py garuda_v3/v108_ps_complete_graph_recovery.py
          python -m pytest -q garuda_v3/tests/test_v108_ps_complete_graph_recovery.py
      - name: Fetch hash-verified CICAPT development captures
        run: |
          python -m garuda_v3.public_data_fetch \
            --catalogue datasets/multisource/catalogue.json \
            --root datasets/v108 \
            --ids cicapt_network \
            --extract
      - name: Train PS-complete GraphSAGE+LSTM candidate
        run: |
          rm -rf garuda_v3/artifacts/certification/v108
          python -m garuda_v3.v108_ps_complete_graph_recovery \
            --phase1 datasets/v108/1stPhase-timed-Merged.pcap \
            --phase2 datasets/v108/2ndPhase-timed-MergedV2.pcap \
            --packet-limit 2000000 \
            --seeds 42 43 44 \
            --epochs 8 \
            --batch-size 64 \
            --output-dir garuda_v3/artifacts/certification/v108
      - name: Verify evidence and full feature contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from garuda_v3.model import GraphWorldModel
          from garuda_v3.ps_complete import FEATURES, SCHEMA
          root=Path('garuda_v3/artifacts/certification/v108')
          r=json.loads((root/'summary.json').read_text())
          model,meta=GraphWorldModel.load(root/'gnn_lstm_ps_complete_candidate.npz')
          assert r['schema_version']=='v108.1'
          assert r['status'] in {'DEV_PS_COMPLETE_PASS','DEV_PS_COMPLETE_FAIL'}
          assert model.schema==SCHEMA
          assert model.f==len(FEATURES)==34
          assert meta['ps_complete_features_trained'] is True
          assert meta['packet_features_trained'] is True
          mandatory={'psh_fraction','urg_fraction','iat_variance_log','iat_max_log','ttl_variance_scaled','fragment_fraction','payload_mean_log','payload_variance_log','payload_max_log','unique_destination_ports_log','sequential_port_transition_fraction','random_port_transition_fraction','retransmission_fraction','retransmission_count_log'}
          assert mandatory.issubset(set(meta['features']))
          assert r['selection']['phase2_used_for_selection'] is False
          assert r['selection']['external_used_for_selection'] is False
          assert r['freeze']['new_external_holdout_selected'] is False
          print(json.dumps({'status':r['status'],'selected_candidate':r['selected_candidate'],'support_gate':r['support_gate']},indent=2))
          PY
      - name: Record immutable V108 development evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garuda_v3/artifacts/certification/v108
          if git diff --cached --quiet; then
            echo 'V108 evidence already recorded'
          else
            git commit -m 'evidence(v108): record PS-complete development recovery'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v108-ps-complete-world-model-evidence
          path: garuda_v3/artifacts/certification/v108/*
          if-no-files-found: error
          retention-days: 30
