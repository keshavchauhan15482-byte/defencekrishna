name: Packet candidate development audit
on:
  pull_request:
    branches: [main]
    paths:
      - garuda_v3/packet_candidate_audit.py
      - .github/workflows/packet-candidate-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packet-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r garuda_v3/requirements.txt
      - name: Frozen checkpoint support audit
        run: python -m garuda_v3.packet_candidate_audit --checkpoint garuda_v3/artifacts/calibrated_host_v6 --output "$RUNNER_TEMP/frozen-packet-audit"
      - name: Train isolated development candidate (no production write)
        run: |
          python -m garuda_v3.train --graphs datasets/ids2018/labelled/Thursday-22-02-2018.npz datasets/ids2018/labelled/Friday-23-02-2018.npz datasets/ids2018/labelled/Thursday-01-03-2018.npz datasets/ids2018/labelled/Friday-02-03-2018.npz --output "$RUNNER_TEMP/packet-candidate" --epochs 20 --history 8 --horizon 4 --stride 2 --seed 44 --decoder residual --calibrate --balance-risk --fpr-budget 0.01 --split-manifest datasets/ids2018/split.json --evaluation-scope development_reused_holdout
      - name: Audit retrained candidate without promotion
        run: python -m garuda_v3.packet_candidate_audit --checkpoint "$RUNNER_TEMP/packet-candidate" --output "$RUNNER_TEMP/retrained-packet-audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-packet-evidence
          path: |
            ${{ runner.temp }}/frozen-packet-audit/
            ${{ runner.temp }}/retrained-packet-audit/
            ${{ runner.temp }}/packet-candidate/metrics.json
          if-no-files-found: warn
          retention-days: 14
