name: V75 support-only stage source freeze

on:
  push:
    branches: [feat/v67-ps9plus-evidence]
    paths:
      - 'garuda_v3/v75_stage_source_support_freeze.py'
      - '.github/workflows/v75-stage-source-support-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
      - name: Compile support-only audit
        run: python -m compileall -q garuda_v3/v75_stage_source_support_freeze.py
      - name: Download X-IIoTID
        run: |
          mkdir -p datasets/v75
          python - <<'PY'
          import shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(f'Expected one X-IIoTID source, got {matches}')
          shutil.copyfile(matches[0],Path('datasets/v75/XIIoTID.csv'))
          PY
      - name: Freeze reserve sources using support counts only
        run: |
          mkdir -p garuda_v3/artifacts/v75_stage_source_freeze
          python -m garuda_v3.v75_stage_source_support_freeze \
            --csv datasets/v75/XIIoTID.csv \
            --output garuda_v3/artifacts/v75_stage_source_freeze/support_freeze.json
      - name: Verify no-model contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v75_stage_source_freeze/support_freeze.json').read_text())
          assert d['selection_used_model_metrics'] is False
          assert d['model_scored_reserve_before_freeze'] is False
          assert all(v>=d['minimum_reserve_per_stage'] for v in d['reserve_stage_support'].values())
          assert all(v>=d['minimum_development_per_stage_after_reserve'] for v in d['development_stage_support'].values())
          print(json.dumps({
            'dataset_sha256':d['dataset_sha256'],
            'selected_reserve_sources':d['selected_reserve_sources'],
            'reserve_stage_support':d['reserve_stage_support'],
            'development_stage_support':d['development_stage_support'],
          },indent=2))
          PY
      - name: Upload support freeze
        uses: actions/upload-artifact@v4
        with:
          name: v75-stage-source-support-freeze
          path: garuda_v3/artifacts/v75_stage_source_freeze/support_freeze.json
          if-no-files-found: error
          retention-days: 30
