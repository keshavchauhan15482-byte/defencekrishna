name: V113 Dridex frozen one-shot

on:
  push:
    branches: [feat/v113-dridex-fresh-one-shot]
    paths:
      - '.github/workflows/v113-dridex-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependency
        run: python -m pip install 'numpy<2.1'
      - name: Verify immutable preregistration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('garuda_v3/artifacts/certification/v113/preregistration.json').read_text())
          a=json.loads(Path('garuda_v3/artifacts/certification/v113/acquisition_manifest.json').read_text())
          assert p['status']=='HASH_FROZEN_ONE_SHOT_ARMED'
          assert p['evaluation_permitted'] is True
          assert p['rerun_for_claim_improvement_permitted'] is False
          assert a['status']=='HASH_FROZEN_NO_DECODE'
          assert a['packet_records_decoded'] is False
          assert a['model_inference_performed'] is False
          assert a['labels_accessed'] is False
          assert p['external_holdout']['sha256']==a['sha256']=='5ec0ad15e4eac30c4155fc9fe9ab66d1dd561f23e8eba029eda08ce9ad36aa48'
          assert p['external_holdout']['bytes']==a['bytes']==202194456
          assert p['registered_candidate']['model_sha256']=='f063ae8c890f9e805c913c02c92b8174cc1d58552514484ea2ef723611258fed'
          assert p['registered_candidate']['support_gate_sha256']=='7006671148e0dba3be55a2fe27a2fd17d3a7ece030dbcddd599c7aaa7f5368c1'
          assert p['registered_candidate']['adapter_contract_sha256']=='2c48468ed2e608377c226137bb432ee85efb27cfcb4ba7052f893816976e2e8c'
          assert not Path('garuda_v3/artifacts/certification/v113/one_shot_result.json').exists()
          PY
      - name: Download exact hash-frozen capture
        run: |
          mkdir -p /tmp/v113
          curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 1200 \
            'https://mcfp.felk.cvut.cz/publicDatasets/CTU-Malware-Capture-Botnet-326-1/2018-01-30_win10.pcap' \
            -o /tmp/v113/2018-01-30_win10.pcap
          echo '5ec0ad15e4eac30c4155fc9fe9ab66d1dd561f23e8eba029eda08ce9ad36aa48  /tmp/v113/2018-01-30_win10.pcap' | sha256sum -c -
      - name: Run frozen one-shot exactly once
        run: |
          python -m garuda_v3.v113_frozen_external_one_shot \
            --pcap /tmp/v113/2018-01-30_win10.pcap \
            --model garuda_v3/artifacts/certification/v108/gnn_lstm_ps_complete_candidate.npz \
            --support-gate garuda_v3/artifacts/certification/v108/support_gate.json \
            --prereg garuda_v3/artifacts/certification/v113/preregistration.json \
            --acquisition garuda_v3/artifacts/certification/v113/acquisition_manifest.json \
            --output garuda_v3/artifacts/certification/v113/one_shot_result.json
      - name: Verify and record immutable PASS or FAIL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('garuda_v3/artifacts/certification/v113/one_shot_result.json').read_text())
          assert r['schema_version']=='v113.1'
          assert r['status'] in {'PASS','FAIL'}
          assert r['one_shot_integrity']['rerun_for_claim_improvement'] is False
          print(json.dumps(r,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garuda_v3/artifacts/certification/v113/one_shot_result.json
          git commit -m 'evidence(v113): record immutable Dridex one-shot result'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v113-dridex-one-shot-evidence
          path: |
            garuda_v3/artifacts/certification/v113/selection_freeze.json
            garuda_v3/artifacts/certification/v113/acquisition_manifest.json
            garuda_v3/artifacts/certification/v113/preregistration.json
            garuda_v3/artifacts/certification/v113/one_shot_result.json
          if-no-files-found: warn
          retention-days: 30
