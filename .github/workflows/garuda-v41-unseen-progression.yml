name: Garuda V41 Unseen-Family Early Progression Forecast

on:
  pull_request:
    branches: [main]
    paths:
      - 'garuda_v3/experiments/v41/**'
      - '.github/workflows/garuda-v41-unseen-progression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v41-unseen-progression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V41 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' 'scikit-learn<1.7'
      - name: Verify frozen V41 protocol
        run: |
          python - <<'PY'
          import json
          p=json.load(open('garuda_v3/experiments/v41/V41_PROTOCOL_FREEZE.json'))
          assert p['frozen_before_results'] is True
          assert p['strict_network_only'] is True
          assert p['forecast_horizon_seconds'] == 240
          assert p['model']['test_information_used_for_selection'] is False
          assert p['locked_final_validation_families'] == ['TcpSynDevice','UdpDevice']
          assert 'not prediction before the first malicious packet' in p['claim_scope']
          print('V41 protocol freeze: PASS')
          PY
      - name: Syntax-check V41
        run: python -m py_compile garuda_v3/experiments/v41/v41_unsw_unseen_progression.py
      - name: Run V41 unseen-family early progression
        working-directory: garuda_v3/experiments/v41
        run: python v41_unsw_unseen_progression.py
      - name: Upload V41 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garuda-v41-unseen-progression-evidence
          path: garuda_v3/experiments/v41/artifacts/unsw_unseen_progression/
          if-no-files-found: warn
