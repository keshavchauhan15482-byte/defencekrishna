name: V111 development warning policy freeze

on:
  push:
    branches: [feat/v111-ctu3272-fresh-one-shot]
    paths:
      - 'garuda_v3/v111_freeze_warning_policy.py'
      - 'garuda_v3/tests/test_v111_warning_policy.py'
      - '.github/workflows/v111-warning-policy-freeze.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v111-warning-policy-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and test policy math
        run: |
          python -m pip install 'numpy<2.1' pytest
          python -m compileall -q garuda_v3/v111_freeze_warning_policy.py
          python -m pytest -q garuda_v3/tests/test_v111_warning_policy.py
      - name: Verify external holdout has not been decoded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('garuda_v3/artifacts/certification/v111')
          a=json.loads((root/'acquisition_manifest.json').read_text())
          p=json.loads((root/'preregistration.json').read_text())
          assert a['status']=='HASH_FROZEN_MODEL_NOT_RUN'
          assert a['packet_records_decoded'] is False
          assert a['graph_windows_constructed'] is False
          assert a['support_scoring_performed'] is False
          assert a['model_inference_performed'] is False
          assert a['external_labels_accessed'] is False
          assert p['prediction_warning_policy']['status']=='DEV_ONLY_FREEZE_PENDING'
          print('V111 external holdout remains pre-decode/pre-inference')
          PY
      - name: Fetch hash-verified CICAPT development capture
        run: |
          python -m garuda_v3.public_data_fetch \
            --catalogue datasets/multisource/catalogue.json \
            --root datasets/v111-dev \
            --ids cicapt_network \
            --extract
      - name: Freeze warning policy from CICAPT Phase-2 development only
        run: |
          python -m garuda_v3.v111_freeze_warning_policy \
            --phase2 datasets/v111-dev/2ndPhase-timed-MergedV2.pcap \
            --model garuda_v3/artifacts/certification/v108/gnn_lstm_ps_complete_candidate.npz \
            --packet-limit 2000000 \
            --batch-size 64 \
            --output garuda_v3/artifacts/certification/v111/warning_policy.json
      - name: Verify leakage boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/certification/v111/warning_policy.json').read_text())
          assert d['status']=='DEV_ONLY_WARNING_POLICY_FROZEN'
          assert d['model']['sha256']=='f063ae8c890f9e805c913c02c92b8174cc1d58552514484ea2ef723611258fed'
          assert d['model']['feature_count']==34
          assert d['reference']['used_for_v108_candidate_selection'] is False
          assert d['score']['prediction_only'] is True
          assert d['score']['observed_future_ground_truth_used'] is False
          assert d['score']['support_score_used'] is False
          assert d['score']['risk_head_used'] is False
          assert d['leakage_contract']['v111_external_packet_used'] is False
          assert d['leakage_contract']['v111_publisher_infection_timestamp_used'] is False
          assert d['leakage_contract']['threshold_refit_on_external_permitted'] is False
          assert d['threshold']['reference_tail_budget']==0.005
          print(json.dumps(d['threshold'],indent=2))
          PY
      - name: Commit warning-policy evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git add -f garuda_v3/artifacts/certification/v111/warning_policy.json
          if git diff --cached --quiet; then
            echo 'warning policy already frozen'
          else
            git commit -m 'evidence(v111): freeze development-only prediction warning policy'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
