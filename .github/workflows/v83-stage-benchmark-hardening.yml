name: V83 stage benchmark hardening

on:
  push:
    branches: [feat/v67-ps9plus-evidence]
    paths:
      - 'garuda_v3/v83_stage_benchmark_hardening.py'
      - '.github/workflows/v83-stage-benchmark-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v83:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile V81-V83 benchmark code
        run: |
          python -m compileall -q \
            garuda_v3/v81_remaining_fresh_subtype_freeze.py \
            garuda_v3/v82_robust_stage_head_fresh_eval.py \
            garuda_v3/v83_stage_benchmark_hardening.py
      - name: Download X-IIoTID
        run: |
          mkdir -p datasets/v83
          python - <<'PY'
          import shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(f'Expected one X-IIoTID source, got {matches}')
          shutil.copyfile(matches[0],Path('datasets/v83/XIIoTID.csv'))
          PY
      - name: Reproduce immutable V81 freeze
        run: |
          mkdir -p garuda_v3/artifacts/v83_stage_benchmark
          python -m garuda_v3.v81_remaining_fresh_subtype_freeze \
            --csv datasets/v83/XIIoTID.csv \
            --output garuda_v3/artifacts/v83_stage_benchmark/v81_freeze.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('garuda_v3/artifacts/v83_stage_benchmark/v81_freeze.json')
          d=json.loads(p.read_text())
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest=='820aa7de8925d3d0812e1df3753c9f4a2c7da0f5d45efd3d16456b33e3e7d75f',digest
          assert d['selection_used_model_metrics'] is False
          assert d['model_training_or_scoring_performed'] is False
          print('V81_FREEZE_SHA256',digest)
          PY
      - name: Run V83 hardened diagnostic
        run: |
          python -m garuda_v3.v83_stage_benchmark_hardening \
            --csv datasets/v83/XIIoTID.csv \
            --freeze garuda_v3/artifacts/v83_stage_benchmark/v81_freeze.json \
            --output garuda_v3/artifacts/v83_stage_benchmark/results \
            --epochs 18
      - name: Verify benchmark contract and release gates
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          d=json.loads(Path('garuda_v3/artifacts/v83_stage_benchmark/results/summary.json').read_text())
          c=d['leakage_contract']
          assert c['reserve_metrics_used_for_gamma_selection'] is False
          assert c['reserve_metrics_used_for_head_selection'] is False
          assert c['reserve_subtypes_seen_by_world_fit_or_validation'] is False
          assert c['reserve_subtypes_seen_by_stage_mapper_fit'] is False
          assert c['attack_labels_are_world_model_inputs'] is False
          assert c['reused_exposed_reserve_labeled_fresh'] is False
          assert c['pre_compromise_claim'] is False
          assert d['architecture_selection']['selection_uses_exposed_reserve_metrics'] is False
          assert d['release_gate']['fresh_claim_allowed'] is False
          for v in [
              d['state_task']['forecast_mse'],
              d['state_task']['persistence_mse'],
              d['stage_task_exposed_diagnostic']['learned_forecast']['macro_f1_supported_classes'],
              d['stage_task_exposed_diagnostic']['persistence_state']['macro_f1_supported_classes'],
          ]:
              assert math.isfinite(float(v)),v
          # Critical benchmark rule: an ineligible head remains explicitly ineligible.
          if not d['architecture_selection']['winner']['development_viable']:
              assert d['release_gate']['release_eligible_for_unseen_subtype_stage_claim'] is False
          if d['stage_task_exposed_diagnostic']['macro_f1_delta_vs_persistence'] <= 0:
              assert d['release_gate']['release_eligible_for_unseen_subtype_stage_claim'] is False
          print(json.dumps({
              'winner':d['architecture_selection']['winner'],
              'state_task':d['state_task'],
              'stage_macro_f1':d['stage_task_exposed_diagnostic']['learned_forecast']['macro_f1_supported_classes'],
              'persistence_macro_f1':d['stage_task_exposed_diagnostic']['persistence_state']['macro_f1_supported_classes'],
              'release_gate':d['release_gate'],
          },indent=2))
          PY
      - name: Upload V83 hardened benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: v83-stage-benchmark-hardening-evidence
          path: garuda_v3/artifacts/v83_stage_benchmark/**/*.json
          if-no-files-found: error
          retention-days: 30
