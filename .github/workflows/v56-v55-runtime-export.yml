name: V56 export portable V55 runtime

on:
  push:
    branches: [fix/joint-family-generalization-v54]
    paths:
      - 'garuda_v3/v55_runtime.py'
      - 'garuda_v3/v56_export_v55_runtime.py'
      - '.github/workflows/v56-v55-runtime-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: |
          python -m pip install 'numpy<2.1' 'pandas<2.3' 'scikit-learn<1.7' 'kagglehub<0.4'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Compile runtime/export code
        run: |
          python -m compileall -q garuda_v3/v55_runtime.py garuda_v3/v56_export_v55_runtime.py
      - name: Download X-IIoTID
        run: |
          mkdir -p datasets/v56
          python - <<'PY'
          import shutil
          from pathlib import Path
          import pandas as pd, kagglehub
          root=Path(kagglehub.dataset_download('munaalhawawreh/xiiotid-iiot-intrusion-dataset'))
          matches=[]
          for p in root.rglob('*.csv'):
              try: cols=pd.read_csv(p,nrows=0).columns
              except Exception: continue
              n={''.join(ch.lower() for ch in str(c) if ch.isalnum()) for c in cols}
              if {'class1','class2','class3'}<=n: matches.append(p)
          if len(matches)!=1: raise RuntimeError(matches)
          shutil.copyfile(matches[0],Path('datasets/v56/XIIoTID.csv'))
          PY
      - name: Export three-seed V55 runtime and assert reload parity
        run: |
          python -m garuda_v3.v56_export_v55_runtime \
            --csv datasets/v56/XIIoTID.csv \
            --frozen-config docs/release/v55_joint_generalization/frozen_config.json \
            --output garuda_v3/artifacts/v56_v55_runtime \
            --epochs 12 --seeds 42 43 44
      - name: Upload validated runtime
        uses: actions/upload-artifact@v4
        with:
          name: v56-portable-v55-runtime
          retention-days: 14
          if-no-files-found: error
          path: garuda_v3/artifacts/v56_v55_runtime/
