name: Garuda V26 Benign-Only Unseen Forecast Development

on:
  pull_request:
    branches: [main]
    paths:
      - 'garuda_v3/experiments/v26/**'
      - '.github/workflows/garuda-v26-worldmodel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benign-worldmodel-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V26 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' 'scikit-learn<1.7'
      - name: Verify protocol frozen before results
        run: |
          python - <<'PY'
          import json
          p=json.load(open('garuda_v3/experiments/v26/V26_PROTOCOL_FREEZE.json'))
          assert p['frozen_before_v26_results'] is True
          assert p['model']['attack_label_as_model_target'] is False
          assert p['feature_policy']['strict_network_only'] is True
          print('V26 protocol freeze: PASS')
          PY
      - name: Run V26 benign-only unseen future world model
        working-directory: garuda_v3/experiments/v26
        run: python v26_iot23_benign_worldmodel.py
      - name: Upload V26 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garuda-v26-benign-worldmodel-evidence
          path: garuda_v3/experiments/v26/artifacts/iot23_benign_worldmodel/
          if-no-files-found: warn
